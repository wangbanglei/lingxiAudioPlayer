    function clampSidebarWidth(width) {
      return Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, width));
    }

    function setSidebarWidth(width) {
      sidebar.style.width = `${clampSidebarWidth(width)}px`;
    }

    function initSidebarResize() {
      const saved = localStorage.getItem(SIDEBAR_WIDTH_KEY);
      if (saved) setSidebarWidth(Number(saved));

      sidebarResizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        sidebarResizer.classList.add('dragging');
        document.body.classList.add('resizing');
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        const layoutLeft = layout.getBoundingClientRect().left;
        setSidebarWidth(e.clientX - layoutLeft);
      });

      document.addEventListener('mouseup', () => {
        if (!isResizing) return;
        isResizing = false;
        sidebarResizer.classList.remove('dragging');
        document.body.classList.remove('resizing');
        localStorage.setItem(SIDEBAR_WIDTH_KEY, parseInt(sidebar.style.width, 10));
      });
    }

    function isVideo(file) {
      if (file.type.startsWith('video/')) return true;
      return /\.mp4$/i.test(file.name);
    }

    function isAudio(file) {
      if (file.type.startsWith('audio/')) return true;
      return /\.mp3$/i.test(file.name);
    }

    function isSupported(file) {
      return isVideo(file) || isAudio(file);
    }

    function folderHasMediaFiles(files) {
      return Array.from(files).some((file) => !isLrc(file) && !isCoverImage(file) && isSupported(file));
    }

    function showIdleView() {
      playerWrap.classList.remove('active');
      emptyState.style.display = 'block';
    }

    function showPlayerView() {
      playerWrap.classList.add('active');
      emptyState.style.display = 'none';
    }

    function updatePlayerInfo(item) {
      playerBadge.className = `player-badge ${item.type}`;
      applyMediaIcon(playerBadge, item);
      playerTitle.textContent = item.name;
      playerSize.textContent = formatSize(item.size);
    }

    function clearPlayerInfo() {
      playerBadge.className = 'player-badge audio';
      applyMediaIcon(playerBadge, { type: 'audio', thumbnailUrl: '' });
      playerTitle.textContent = '';
      playerSize.textContent = '';
      resetPlayerControls();
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      const pad = (n) => String(n).padStart(2, '0');
      if (h > 0) return `${h}:${pad(m)}:${pad(s)}`;
      return `${m}:${pad(s)}`;
    }

    function setControlsEnabled(enabled) {
      progressBar.disabled = !enabled;
      btnPlayPause.disabled = !enabled;
      btnSeekBack.disabled = !enabled;
      btnSeekForward.disabled = !enabled;
      if (!enabled) {
        btnPrev.disabled = true;
        btnNext.disabled = true;
      } else {
        updateTrackButtons();
      }
    }

    function updateTrackButtons() {
      const list = getDisplayItems();
      const index = list.findIndex((item) => item.id === activeId);
      const hasActive = activeId !== null && list.length > 0;
      btnPrev.disabled = !hasActive || index <= 0;
      btnNext.disabled = !hasActive || index >= list.length - 1;
    }

    function playPrev() {
      const list = getDisplayItems();
      const index = list.findIndex((item) => item.id === activeId);
      if (index > 0) playItem(list[index - 1].id);
    }

    function playNext() {
      const list = getDisplayItems();
      const index = list.findIndex((item) => item.id === activeId);
      if (index < list.length - 1) playItem(list[index + 1].id);
    }

    function resetPlayerControls() {
      isSeeking = false;
      progressBar.value = 0;
      setProgressFill(0);
      timeCurrent.textContent = '0:00';
      timeDuration.textContent = '0:00';
      btnPlayPause.textContent = '▶';
      btnPlayPause.title = '播放（Space）';
      audioVisual.classList.remove('playing');
      setControlsEnabled(false);
    }

    function getActivePlayer() {
      return activeMediaEl;
    }

    function setProgressFill(percent) {
      const value = Math.max(0, Math.min(100, percent));
      progressBar.style.setProperty('--progress', `${value}%`);
    }

    function updateProgressUI() {
      const player = getActivePlayer();
      if (!player) return;

      let currentTime = player.currentTime;
      if (!isSeeking) {
        timeCurrent.textContent = formatTime(player.currentTime);
        if (Number.isFinite(player.duration) && player.duration > 0) {
          const percent = (player.currentTime / player.duration) * 100;
          progressBar.value = percent;
          setProgressFill(percent);
          timeDuration.textContent = formatTime(player.duration);
        }
      } else if (Number.isFinite(player.duration) && player.duration > 0) {
        currentTime = (Number(progressBar.value) / 100) * player.duration;
      }

      updateSubtitles(currentTime);

      if (!player.paused && activeId !== null && !isSeeking) {
        saveCurrentPositionThrottled();
      }
    }

    function updatePlayPauseButton() {
      const player = getActivePlayer();
      if (!player) return;
      const paused = player.paused;
      btnPlayPause.textContent = paused ? '▶' : '⏸';
      btnPlayPause.title = paused ? '播放（Space）' : '暂停（Space）';
      audioVisual.classList.toggle('playing', !paused && activeMediaEl === audioPlayer);
    }

    function updateMuteButton() {
      const player = getActivePlayer();
      const muted = player ? player.muted || player.volume === 0 : volumeBar.value === '0';
      btnMute.textContent = muted ? '🔇' : '🔊';
      btnMute.title = muted ? '取消静音' : '静音';
    }

    function applyVolume(value) {
      const vol = Math.max(0, Math.min(1, value));
      videoPlayer.volume = vol;
      audioPlayer.volume = vol;
      videoPlayer.muted = vol === 0;
      audioPlayer.muted = vol === 0;
      volumeBar.value = vol;
      localStorage.setItem(VOLUME_KEY, String(vol));
      updateMuteButton();
    }

    function applyPlaybackRate(rate) {
      const r = Number(rate);
      if (!PLAYBACK_RATES.includes(r)) return;
      videoPlayer.playbackRate = r;
      audioPlayer.playbackRate = r;
      speedSelect.value = String(r);
      localStorage.setItem(PLAYBACK_RATE_KEY, String(r));
    }

    function getSavedPlaybackRate() {
      const saved = Number(localStorage.getItem(PLAYBACK_RATE_KEY));
      return PLAYBACK_RATES.includes(saved) ? saved : 1;
    }

    function togglePlayPause() {
      const player = getActivePlayer();
      if (!player) return;
      if (player.paused) {
        player.play().catch(() => {});
      } else {
        player.pause();
      }
    }

    function toggleMute() {
      const player = getActivePlayer();
      if (!player) return;
      if (player.muted || player.volume === 0) {
        const saved = Number(localStorage.getItem(VOLUME_KEY));
        applyVolume(saved > 0 ? saved : 1);
      } else {
        applyVolume(0);
      }
    }

    function seekToTime(seconds) {
      const player = getActivePlayer();
      if (!player) return;
      const duration = player.duration;
      let target = seconds;
      if (Number.isFinite(duration)) {
        target = Math.max(0, Math.min(duration, target));
      } else {
        target = Math.max(0, target);
      }
      player.currentTime = target;
      updateProgressUI();
      saveCurrentPosition();
    }

    function seekBy(seconds) {
      const player = getActivePlayer();
      if (!player) return;
      seekToTime(player.currentTime + seconds);
    }

    function seekToPercent(percent) {
      const player = getActivePlayer();
      if (!player || !Number.isFinite(player.duration)) return;
      player.currentTime = (percent / 100) * player.duration;
      updateProgressUI();
    }

    function stopPlayback(savePosition = false) {
      if (savePosition && activeMediaEl && activeId !== null) {
        savePositionForFile(activeId, activeMediaEl);
      }
      videoPlayer.pause();
      audioPlayer.pause();
      videoPlayer.removeAttribute('src');
      audioPlayer.removeAttribute('src');
      videoPlayer.classList.remove('visible');
      audioVisual.classList.remove('visible');
      audioVisual.classList.remove('playing');
      activeMediaEl = null;
      resetPlayerControls();
      clearSubtitles();
    }

    function onMediaLoaded() {
      const player = getActivePlayer();
      if (!player) return;
      timeDuration.textContent = formatTime(player.duration);
      const savedPos = getSavedPosition(activeId);
      if (savedPos > 0 && Number.isFinite(player.duration) && savedPos < player.duration - 3) {
        player.currentTime = savedPos;
      }
      player.playbackRate = getSavedPlaybackRate();
      speedSelect.value = String(player.playbackRate);
      setControlsEnabled(true);
      updateProgressUI();
      updatePlayPauseButton();
    }

    function initCustomPlayer() {
      const savedVolume = Number(localStorage.getItem(VOLUME_KEY));
      applyVolume(Number.isFinite(savedVolume) ? savedVolume : 1);
      applyPlaybackRate(getSavedPlaybackRate());

      [videoPlayer, audioPlayer].forEach((el) => {
        el.addEventListener('timeupdate', updateProgressUI);
        el.addEventListener('loadedmetadata', onMediaLoaded);
        el.addEventListener('play', updatePlayPauseButton);
        el.addEventListener('pause', () => {
          updatePlayPauseButton();
          saveCurrentPosition();
        });
        el.addEventListener('ended', () => {
          updatePlayPauseButton();
          if (activeId !== null) {
            const finishedId = activeId;
            delete playbackPositions[String(finishedId)];
            persistPositions();
            markAsCompleted(finishedId);
            updateFileItemMeta(finishedId);
          }
          if (autoPlayNext.checked) {
            playNext();
          }
        });
      });

      btnPlayPause.addEventListener('click', togglePlayPause);
      btnPrev.addEventListener('click', playPrev);
      btnNext.addEventListener('click', playNext);
      btnSeekBack.addEventListener('click', () => seekBy(-10));
      btnSeekForward.addEventListener('click', () => seekBy(10));
      btnMute.addEventListener('click', toggleMute);

      progressBar.addEventListener('mousedown', () => { isSeeking = true; });
      progressBar.addEventListener('touchstart', () => { isSeeking = true; }, { passive: true });
      progressBar.addEventListener('input', () => {
        const percent = Number(progressBar.value);
        setProgressFill(percent);
        seekToPercent(percent);
      });
      progressBar.addEventListener('change', () => {
        isSeeking = false;
        saveCurrentPosition();
      });
      document.addEventListener('mouseup', () => { isSeeking = false; });

      volumeBar.addEventListener('input', () => applyVolume(Number(volumeBar.value)));
      speedSelect.addEventListener('change', () => applyPlaybackRate(Number(speedSelect.value)));

      autoPlayNext.checked = localStorage.getItem(AUTO_PLAY_NEXT_KEY) === 'true';
      autoPlayNext.addEventListener('change', () => {
        localStorage.setItem(AUTO_PLAY_NEXT_KEY, String(autoPlayNext.checked));
      });

      subtitleLines.addEventListener('click', (e) => {
        const btn = e.target.closest('.subtitle-line-seek');
        if (!btn) return;
        const lineEl = btn.closest('.subtitle-line');
        if (!lineEl) return;
        const time = Number(lineEl.dataset.time);
        if (!Number.isFinite(time)) return;
        seekToTime(time);
      });

      subtitleScroll.addEventListener('mouseenter', () => {
        isSubtitleHovered = true;
      });
      subtitleScroll.addEventListener('mouseleave', () => {
        isSubtitleHovered = false;
        if (activeSubtitleIndex >= 0 && subtitleLines.children[activeSubtitleIndex]) {
          subtitleLines.children[activeSubtitleIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      });
    }

    function isShortcutBlocked(target) {
      const tag = target.tagName;
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || target.isContentEditable;
    }

    function initKeyboardShortcuts() {
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
          e.preventDefault();
          searchInput.focus();
          searchInput.select();
          return;
        }

        if (isShortcutBlocked(e.target)) return;

        switch (e.code) {
          case 'Space':
            e.preventDefault();
            togglePlayPause();
            break;
          case 'ArrowLeft':
            e.preventDefault();
            seekBy(-10);
            break;
          case 'ArrowRight':
            e.preventDefault();
            seekBy(10);
            break;
          case 'PageUp':
            e.preventDefault();
            playPrev();
            break;
          case 'PageDown':
            e.preventDefault();
            playNext();
            break;
        }
      });
    }

    function formatSize(bytes) {
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
    }

    function formatFileMeta(item) {
      const parts = [formatSize(item.size)];
      if (item.duration > 0) parts.push(formatTime(item.duration));
      if (isCompleted(item.id)) {
        parts.push('已播完');
      } else {
        const savedPos = getSavedPosition(item.id);
        if (savedPos > 0) parts.push(`上次 ${formatTime(savedPos)}`);
      }
      if (item.subtitleLines?.length) parts.push('字幕');
      return parts.join(' · ');
    }

    function updateFileItemMeta(id) {
      const item = mediaItems.find((m) => m.id === id);
      if (!item) return;
      const li = fileList.querySelector(`[data-id="${id}"]`);
      if (!li) return;
      const meta = li.querySelector('.file-meta');
      if (meta) meta.textContent = formatFileMeta(item);
    }

    function probeMediaDuration(file, type) {
      return new Promise((resolve) => {
        const el = type === 'video' ? document.createElement('video') : document.createElement('audio');
        const url = URL.createObjectURL(file);
        el.preload = 'metadata';

        const cleanup = () => {
          el.removeAttribute('src');
          el.load();
          URL.revokeObjectURL(url);
        };

        el.addEventListener('loadedmetadata', () => {
          const duration = Number.isFinite(el.duration) ? el.duration : 0;
          cleanup();
          resolve(duration);
        });
        el.addEventListener('error', () => {
          cleanup();
          resolve(0);
        });
        el.src = url;
      });
    }

    function addMediaFile(file, companionCover = null) {
      const type = isVideo(file) ? 'video' : 'audio';
      const folder = getNormalizedFolder(getFolderFromFile(file));
      return probeMediaDuration(file, type)
        .then((duration) => dbAddFile(file, duration, folder))
        .then((record) => recordToItem(record))
        .then((item) => generateMediaThumbnail(file, type, companionCover).then((thumbnailBlob) => {
          if (!thumbnailBlob) return item;
          attachThumbnailToItem(item, thumbnailBlob);
          return dbUpdateThumbnail(item.id, thumbnailBlob).then(() => item);
        }));
    }

    function probeMissingDurations() {
      const pending = mediaItems.filter((item) => !item.duration);
      if (!pending.length) return Promise.resolve();

      return Promise.all(pending.map((item) => probeMediaDuration(item.file, item.type).then((duration) => {
        item.duration = duration;
        if (duration > 0) return dbUpdateDuration(item.id, duration);
      }))).then(() => {
        renderList();
      });
    }

    function probeMissingThumbnails() {
      const pending = mediaItems.filter((item) => !item.thumbnailUrl);
      if (!pending.length) return Promise.resolve();

      return Promise.all(pending.map((item) => generateMediaThumbnail(item.file, item.type).then((thumbnailBlob) => {
        if (!thumbnailBlob) return;
        attachThumbnailToItem(item, thumbnailBlob);
        return dbUpdateThumbnail(item.id, thumbnailBlob);
      }))).then(() => {
        renderList();
        if (activeId !== null) {
          const activeItem = mediaItems.find((m) => m.id === activeId);
          if (activeItem) updatePlayerInfo(activeItem);
        }
      });
    }

    function compareFileName(a, b) {
      return a.name.localeCompare(b.name, 'zh-CN', { sensitivity: 'base', numeric: true });
    }

    function getGroupedItems() {
      const groups = new Map();
      getDisplayItems().forEach((item) => {
        const folder = item.folder || UNGROUPED_FOLDER;
        if (!groups.has(folder)) groups.set(folder, []);
        groups.get(folder).push(item);
      });

      const folderNames = [...groups.keys()].sort((a, b) => {
        if (a === UNGROUPED_FOLDER) return 1;
        if (b === UNGROUPED_FOLDER) return -1;
        return a.localeCompare(b, 'zh-CN', { sensitivity: 'base', numeric: true });
      });

      return folderNames.map((folder) => ({ folder, items: groups.get(folder) }));
    }

    function shouldShowFolderGroups(groups) {
      if (groups.length > 1) return true;
      return groups.length === 1 && groups[0].folder !== UNGROUPED_FOLDER;
    }

    function createFileListItem(item) {
      const li = document.createElement('li');
      li.className = 'file-item' + (item.id === activeId ? ' active' : '');
      li.dataset.id = item.id;

      const icon = document.createElement('span');
      icon.className = `file-icon ${item.type}`;
      applyMediaIcon(icon, item);

      const details = document.createElement('div');
      details.className = 'file-details';

      const name = document.createElement('div');
      name.className = 'file-name';
      name.textContent = item.name;
      name.title = item.name;

      const meta = document.createElement('div');
      meta.className = 'file-meta';
      meta.textContent = formatFileMeta(item);

      details.appendChild(name);
      details.appendChild(meta);

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'btn-remove';
      removeBtn.title = '移除';
      removeBtn.textContent = '×';
      removeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        removeItem(item.id);
      });

      li.appendChild(icon);
      li.appendChild(details);
      li.appendChild(removeBtn);
      li.addEventListener('click', () => playItem(item.id));
      return li;
    }

    function toggleFolderGroup(folder) {
      if (collapsedFolders.has(folder)) collapsedFolders.delete(folder);
      else collapsedFolders.add(folder);
      persistCollapsedFolders();
      renderList();
    }

    function updateLocateButton() {
      btnLocate.disabled = isImporting || isRefreshing || activeId === null || !mediaItems.some((item) => item.id === activeId);
    }

    function scrollToActiveFileItem() {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const el = fileList.querySelector(`[data-id="${activeId}"]`);
          if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
        });
      });
    }

    function locateActiveFile() {
      if (activeId === null) return;
      const item = mediaItems.find((m) => m.id === activeId);
      if (!item) return;

      let needRender = false;

      if (searchQuery.trim()) {
        searchInput.value = '';
        searchQuery = '';
        updateSearchClearButton();
        needRender = true;
      }

      const folder = item.folder || UNGROUPED_FOLDER;
      if (folder !== UNGROUPED_FOLDER && collapsedFolders.has(folder)) {
        collapsedFolders.delete(folder);
        persistCollapsedFolders();
        needRender = true;
      }

      if (needRender) renderList();
      scrollToActiveFileItem();
    }

    function getDisplayItems() {
      const query = searchQuery.trim().toLowerCase();
      let items = mediaItems;
      if (query) {
        items = mediaItems.filter((item) => {
          const name = item.name.toLowerCase();
          const folder = (item.folder || UNGROUPED_FOLDER).toLowerCase();
          return name.includes(query) || folder.includes(query);
        });
      }
      items = [...items];
      if (sortOrder === 'name-asc') return items.sort((a, b) => compareFileName(a, b));
      if (sortOrder === 'name-desc') return items.sort((a, b) => compareFileName(b, a));
      return items;
    }

    function updateSearchClearButton() {
      btnSearchClear.hidden = !searchQuery;
    }

    function setSearchQuery(value) {
      searchQuery = value;
      updateSearchClearButton();
      renderList();
      updateTrackButtons();
    }

    function updateSortButton() {
      const titles = {
        added: '按添加顺序',
        'name-asc': '文件名 A → Z',
        'name-desc': '文件名 Z → A',
      };
      const icons = {
        added: ICON_PATHS.sortDefault,
        'name-asc': ICON_PATHS.sortUp,
        'name-desc': ICON_PATHS.sortDown,
      };
      btnSortIcon.src = icons[sortOrder];
      btnSort.title = titles[sortOrder];
      btnSort.classList.toggle('active', sortOrder !== 'added');
    }

    function toggleSort() {
      if (sortOrder === 'added') sortOrder = 'name-asc';
      else if (sortOrder === 'name-asc') sortOrder = 'name-desc';
      else sortOrder = 'added';
      localStorage.setItem(SORT_KEY, sortOrder);
      updateSortButton();
      renderList();
      updateTrackButtons();
    }

    function addFiles(files) {
      const allFiles = Array.from(files);
      const lrcFiles = allFiles.filter(isLrc);
      const coverImages = allFiles.filter(isCoverImage);
      const coverMap = buildCoverImageMap(coverImages);
      const supported = allFiles.filter((file) => !isLrc(file) && !isCoverImage(file) && isSupported(file));

      const existingKeys = new Set(
        mediaItems.map((item) => getMediaFileKey(item.name, getNormalizedFolder(item.folder), item.size)),
      );
      const uniqueSupported = [];
      const skipped = [];
      supported.forEach((file) => {
        const key = getFileKey(file);
        if (existingKeys.has(key)) {
          skipped.push(file.name);
          return;
        }
        existingKeys.add(key);
        uniqueSupported.push(file);
      });

      if (uniqueSupported.length === 0 && lrcFiles.length === 0 && coverImages.length === 0) {
        if (skipped.length > 0) {
          alert('所选文件均已存在，未添加重复项');
        } else {
          alert('仅支持 MP4、MP3、LRC 字幕和封面图片文件');
        }
        return Promise.resolve();
      }

      const hasCoverOnly = uniqueSupported.length === 0 && lrcFiles.length === 0 && coverImages.length > 0;
      if (skipped.length > 0 && !hasCoverOnly) {
        alert(`已跳过 ${skipped.length} 个重复文件：\n${skipped.join('\n')}`);
      }

      const addMedia = uniqueSupported.length
        ? Promise.all(uniqueSupported.map((file) => {
          const coverEntry = coverMap.get(getCoverLookupKeyFromFile(file));
          return addMediaFile(file, coverEntry?.file || null);
        })).then((items) => {
          items.forEach((item) => mediaItems.push(item));
        })
        : Promise.resolve();

      return addMedia
        .then(() => (lrcFiles.length ? processLrcFiles(lrcFiles) : null))
        .then(() => (coverImages.length ? processCoverImages(coverImages) : null))
        .then(() => cleanupSuffixedDuplicateFolders())
        .then(() => {
          renderList();
          updateRefreshButton();
        })
        .catch(() => {
          alert('保存文件失败，请重试');
        });
    }

    function removeItem(id) {
      const index = mediaItems.findIndex((item) => item.id === id);
      if (index === -1) return;

      dbDeleteFile(id)
        .then(() => {
          const [removed] = mediaItems.splice(index, 1);
          revokeItemUrls(removed);
          removeSavedPosition(id);
          removeCompleted(id);

          if (activeId === id) {
            activeId = null;
            saveActiveId();
            stopPlayback();
            showIdleView();
            clearPlayerInfo();

            if (mediaItems.length > 0) {
              const next = mediaItems[Math.min(index, mediaItems.length - 1)];
              playItem(next.id);
            }
          }

          renderList();
        })
        .catch(() => {
          alert('删除文件失败，请重试');
        });
    }

    function loadPersistedFiles() {
      return dbGetAllFiles()
        .then((records) => {
          mediaItems.length = 0;
          records.forEach((record) => {
            mediaItems.push(recordToItem(record));
          });
          renderList();

          const savedActiveId = Number(localStorage.getItem(ACTIVE_ID_KEY));
          if (savedActiveId && mediaItems.some((item) => item.id === savedActiveId)) {
            playItem(savedActiveId);
          }

          return probeMissingDurations()
            .then(() => probeMissingThumbnails())
            .then(() => cleanupSuffixedDuplicateFolders());
        })
        .then(() => {
          updateRefreshButton();
        })
        .catch(() => {
          alert('加载已保存文件失败');
        });
    }

    function clearFolderItems(folder) {
      const items = mediaItems.filter((item) => (item.folder || UNGROUPED_FOLDER) === folder);
      if (!items.length) return;

      const label = folder === UNGROUPED_FOLDER ? '未分组' : folder;
      if (!confirm(`确定清空「${label}」下的全部文件吗？此操作不可恢复。`)) return;

      Promise.all(items.map((item) => dbDeleteFile(item.id)))
        .then(() => {
          const ids = new Set(items.map((item) => item.id));
          items.forEach((item) => {
            URL.revokeObjectURL(item.objectUrl);
            if (item.thumbnailUrl) URL.revokeObjectURL(item.thumbnailUrl);
            removeSavedPosition(item.id);
            removeCompleted(item.id);
          });

          for (let i = mediaItems.length - 1; i >= 0; i -= 1) {
            if (ids.has(mediaItems[i].id)) mediaItems.splice(i, 1);
          }

          if (activeId !== null && ids.has(activeId)) {
            activeId = null;
            saveActiveId();
            stopPlayback();
            showIdleView();
            clearPlayerInfo();
          }

          renderList();
        })
        .catch(() => {
          alert('清空失败，请重试');
        });
    }

    function clearAllItems() {
      if (mediaItems.length === 0) return;
      if (!confirm('确定清空全部文件吗？此操作不可恢复。')) return;

      dbClearAll()
        .then(() => dbClearFolderHandles())
        .then(() => {
          mediaItems.forEach((item) => revokeItemUrls(item));
          mediaItems.length = 0;
          folderHandles.clear();
          searchInput.value = '';
          searchQuery = '';
          updateSearchClearButton();
          activeId = null;
          saveActiveId();
          clearAllPositions();
          clearAllCompleted();
          stopPlayback();
          showIdleView();
          clearPlayerInfo();
          renderList();
          updateRefreshButton();
        })
        .catch(() => {
          alert('清空失败，请重试');
        });
    }

    function renderList() {
      fileList.innerHTML = '';
      const groups = getGroupedItems();
      const isSearching = searchQuery.trim().length > 0;

      if (groups.length === 0) {
        if (isSearching && mediaItems.length > 0) {
          const empty = document.createElement('li');
          empty.className = 'file-list-empty';
          empty.textContent = '无匹配结果';
          fileList.appendChild(empty);
        }
        updateLocateButton();
        return;
      }

      if (!shouldShowFolderGroups(groups)) {
        groups[0]?.items.forEach((item) => {
          fileList.appendChild(createFileListItem(item));
        });
        updateLocateButton();
        return;
      }

      groups.forEach(({ folder, items }) => {
        const group = document.createElement('li');
        const collapsed = !isSearching && collapsedFolders.has(folder);
        group.className = 'folder-group' + (collapsed ? ' collapsed' : '');

        const header = document.createElement('div');
        header.className = 'folder-header';
        header.title = folder;

        const chevron = document.createElement('span');
        chevron.className = 'folder-chevron';
        chevron.textContent = '▼';

        const folderName = document.createElement('span');
        folderName.className = 'folder-name';
        folderName.textContent = folder;

        const count = document.createElement('span');
        count.className = 'folder-count';
        count.textContent = String(items.length);

        const clearBtn = document.createElement('button');
        clearBtn.type = 'button';
        clearBtn.className = 'btn-folder-clear';
        clearBtn.title = '清空此文件夹';
        clearBtn.setAttribute('aria-label', '清空此文件夹');
        const clearIcon = document.createElement('img');

        activeMediaEl = audioPlayer;

    function setupDropZone(el) {
      let dragCounter = 0;

      el.addEventListener('dragenter', (e) => {
        e.preventDefault();
        dragCounter += 1;
        el.classList.add('dragover');
      }, true);

      el.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
      }, true);

      el.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dragCounter -= 1;
        if (dragCounter <= 0) {
          dragCounter = 0;
          el.classList.remove('dragover');
        }
      }, true);

      el.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        dragCounter = 0;
        el.classList.remove('dragover');
        getFilesFromDrop(e.dataTransfer).then((files) => {
          if (files.length) importFilesWithLoading(files);
        });
      }, true);
    }

      });

        }
      });
    }

## 一、播放器

### 简介

\`index.html\` 是聆息的主程序，双击或用浏览器打开即可使用。支持 MP4 / MP3 播放、LRC 字幕同步、播放进度记忆与媒体库持久化。

### 功能介绍

#### 媒体管理

- 支持添加 **MP4、MP3** 音视频文件
- 支持导入 **LRC 字幕**（按文件名自动匹配同名媒体）
- 支持导入 **封面图片**（jpg / png / webp 等，按文件名自动匹配同名媒体）
- 拖拽文件到左侧目录，或点击「添加」按钮选择文件
- 列表显示文件大小、时长、上次播放位置、已播完状态、字幕标记
- 三种排序方式：默认（添加顺序）、名称升序、名称降序
- 侧边栏宽度可拖拽调整（180–600px），刷新后保持

#### 播放控制

- 自定义播放界面：进度条、播放/暂停、±10 秒、上一曲/下一曲
- 音量调节与静音
- 播放倍速：0.5x ~ 2x
- 音频显示波形动画，视频按 16:9 比例展示
- LRC 字幕实时滚动同步
- 可选「播放结束后自动下一首」

#### 数据持久化

- **IndexedDB** 保存媒体文件，刷新页面后文件仍在
- **localStorage** 记录：
  - 每个文件的播放进度
  - 已播完标记
  - 当前选中文件、排序方式、音量、倍速、侧边栏宽度等

### 使用方法

1. 用浏览器直接打开 \`index.html\`
2. 将 MP4 / MP3 / LRC / 封面图片拖入左侧「媒体目录」，或点击添加按钮选择文件
3. 在列表中点击文件开始播放
4. 使用底部控制栏或快捷键操作播放

> 列表为空时，点击空白区域可快速打开文件选择器；已有文件时请点击「添加」按钮。

### 快捷键

| 快捷键 | 功能 |
|--------|------|
| \`Space\` | 播放 / 暂停 |
| \`←\` | 后退 10 秒 |
| \`→\` | 前进 10 秒 |
| \`PageUp\` | 上一曲 |
| \`PageDown\` | 下一曲 |

鼠标悬停在操作按钮上可查看对应提示。

### 设计说明

- **单文件架构**：所有逻辑、样式、资源内嵌于 \`index.html\`，部署简单，双击即用
- **本地优先**：文件与播放数据均保存在浏览器本地，不上传服务器
- **深色主题**：适配长时间观看/收听场景
- **渐进增强**：空列表引导、播放状态反馈、列表元信息一目了然

### 技术栈

- HTML5 + CSS3 + 原生 JavaScript
- IndexedDB（媒体文件存储）
- localStorage（用户偏好与播放状态）
- File API / Blob URL（本地文件读取与播放）

### 浏览器兼容

建议使用现代浏览器（Chrome、Edge、Firefox 等）。需支持 IndexedDB 与 HTML5 音视频播放。

## 二、咪咕歌单下载脚本

### 简介

\`download-migu-playlist.js\` 是一个 **Node.js 命令行工具**，用于从咪咕音乐批量下载歌单中的歌曲，并自动生成与聆息播放器配套的文件：

- **MP3 音频**（优先 320k 音质）
- **LRC 歌词**（同名匹配，导入后自动显示字幕）
- **封面图片**（jpg / png / webp，同名匹配，导入后显示缩略图）

下载完成后，将整个歌单文件夹拖入聆息左侧「媒体目录」即可播放。

### 环境要求

- [Node.js](https://nodejs.org/) 18 及以上（需支持原生 \`fetch\`）

### 使用方法

在终端进入项目目录（或任意希望保存歌单的目录），执行：

\`\`\`bash
# 方式一：直接传入歌单 ID
node download-migu-playlist.js 235890246

# 方式二：使用参数
node download-migu-playlist.js --playlistId 235890246

# 指定歌单类型（默认为 create）
node download-migu-playlist.js -p 235890246 --playlistType create
\`\`\`

**歌单 ID 获取方式**：打开咪咕音乐歌单页面，URL 中的 \`playlistId\` 即为所需 ID，例如：

\`\`\`
https://music.migu.cn/v5/#/playlist?playlistId=235890246&playlistType=create
                                                      ^^^^^^^^^
\`\`\`

### 保存规则

脚本会在**当前工作目录**下自动创建 \`audio\` 文件夹（已存在则直接使用），并在其中创建以歌单名命名的子文件夹，每首歌保存为三个同名文件：

\`\`\`
audio/
└── 歌单名/
    ├── 歌曲名-歌手名.mp3
    ├── 歌曲名-歌手名.lrc
    └── 歌曲名-歌手名.jpg
\`\`\`

### 其他说明

- 自动翻页加载歌单中的全部歌曲
- 本地已存在的完整文件（音频、歌词、封面）会自动跳过，适合断点续下
- 按 \`Ctrl+C\` 取消时，会删除当前未下载完成的临时文件
- 部分歌曲可能因版权限制无法获取下载链接，脚本会跳过并继续下一首

> 本脚本仅供个人学习与研究使用，请遵守相关法律法规及平台服务条款。

      function escapeHtml(text) {
        return text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function inlineMarkdown(text) {
        return escapeHtml(text)
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/`([^`]+)`/g, '<code>$1</code>');
      }

      function renderMarkdown(md) {
        const lines = md.replace(/\r\n/g, '\n').split('\n');
        let html = '';
        let inCode = false;
        let codeLines = [];
        let inList = false;
        let tableLines = [];

        const closeList = () => {
          if (inList) {
            html += '</ul>';
            inList = false;
          }
        };

        const flushTable = () => {
          if (!tableLines.length) return;
          const rows = tableLines.filter((line) => !/^\|[-\s:|]+\|$/.test(line.trim()));
          tableLines = [];
          if (!rows.length) return;

          html += '<table>';
          rows.forEach((row, index) => {
            const cells = row.trim().replace(/^\||\|$/g, '').split('|').map((cell) => cell.trim());
            const tag = index === 0 ? 'th' : 'td';
            if (index === 0) html += '<thead><tr>';
            else if (index === 1) html += '<tbody><tr>';
            else html += '<tr>';
            html += cells.map((cell) => `<${tag}>${inlineMarkdown(cell)}</${tag}>`).join('');
            html += '</tr>';
            if (index === 0) html += '</thead>';
          });
          html += '</tbody></table>';
        };

        lines.forEach((line) => {
          if (line.startsWith('```')) {
            closeList();
            flushTable();
            if (!inCode) {
              inCode = true;
              codeLines = [];
            } else {
              html += `<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`;
              inCode = false;
            }
            return;
          }

          if (inCode) {
            codeLines.push(line);
            return;
          }

          if (line.trim().startsWith('|')) {
            closeList();
            tableLines.push(line);
            return;
          }

          flushTable();

          if (!line.trim()) {
            closeList();
            return;
          }

          if (/^-{3,}$/.test(line.trim())) {
            closeList();
            flushTable();
            html += '<hr>';
            return;
          }

          const nestedListMatch = line.match(/^  - (.+)$/);
          if (nestedListMatch) {
            if (!inList) {
              html += '<ul>';
              inList = true;
            }
            html += `<li class="nested">${inlineMarkdown(nestedListMatch[1])}</li>`;
            return;
          }

          if (line.startsWith('#### ')) {
            closeList();
            html += `<h4>${inlineMarkdown(line.slice(5))}</h4>`;
            return;
          }

          if (line.startsWith('### ')) {
            closeList();
            html += `<h3>${inlineMarkdown(line.slice(4))}</h3>`;
            return;
          }

          if (line.startsWith('## ')) {
            closeList();
            html += `<h2>${inlineMarkdown(line.slice(3))}</h2>`;
            return;
          }

          if (line.startsWith('# ')) {
            closeList();
            html += `<h1>${inlineMarkdown(line.slice(2))}</h1>`;
            return;
          }

          if (line.startsWith('> ')) {
            closeList();
            html += `<blockquote><p>${inlineMarkdown(line.slice(2))}</p></blockquote>`;
            return;
          }

          if (line.startsWith('- ')) {
            if (!inList) {
              html += '<ul>';
              inList = true;
            }
            html += `<li>${inlineMarkdown(line.slice(2))}</li>`;
            return;
          }

          closeList();
          html += `<p>${inlineMarkdown(line)}</p>`;
        });

        closeList();
        flushTable();
        if (inCode) {
          html += `<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`;
        }
        return html;
      }
