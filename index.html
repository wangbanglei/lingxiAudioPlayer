<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>聆息音乐播放器</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      padding: 16px 20px;
      border-bottom: 1px solid #1e293b;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .btn-help {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: #1e293b;
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .btn-help:hover {
      background: #334155;
      color: #e2e8f0;
    }

    .help-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(4px);
    }

    .help-overlay.open { display: flex; }

    .help-dialog {
      width: min(720px, 100%);
      max-height: min(85vh, 900px);
      display: flex;
      flex-direction: column;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .help-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }

    .help-header h2 {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .help-close {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #94a3b8;
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
    }

    .help-close:hover {
      background: #334155;
      color: #e2e8f0;
    }

    .help-body {
      padding: 20px 24px 24px;
      overflow-y: auto;
      font-size: 0.9rem;
      line-height: 1.7;
      color: #cbd5e1;
      scrollbar-width: thin;
      scrollbar-color: #334155 transparent;
    }

    .help-body::-webkit-scrollbar { width: 6px; }
    .help-body::-webkit-scrollbar-track { background: transparent; }
    .help-body::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    .help-body h1,
    .help-body h2,
    .help-body h3 {
      color: #f1f5f9;
      margin: 1.4em 0 0.6em;
      line-height: 1.4;
    }

    .help-body h1 { font-size: 1.35rem; margin-top: 0; }
    .help-body h2 { font-size: 1.1rem; border-bottom: 1px solid #334155; padding-bottom: 0.35em; }
    .help-body h3 { font-size: 0.98rem; color: #e2e8f0; }

    .help-body h4 {
      font-size: 0.92rem;
      color: #cbd5e1;
      margin: 1em 0 0.5em;
      font-weight: 600;
    }

    .help-body hr {
      border: none;
      border-top: 1px solid #334155;
      margin: 1.2em 0;
    }

    .help-body a {
      color: #60a5fa;
      text-decoration: none;
    }

    .help-body a:hover { text-decoration: underline; }

    .help-body .help-download-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      margin: 0 2px;
      vertical-align: middle;
      border-radius: 4px;
      text-decoration: none !important;
    }

    .help-body .help-download-icon img {
      width: 20px;
      height: 20px;
      display: block;
      filter: brightness(0) saturate(100%) invert(27%) sepia(98%) saturate(2476%) hue-rotate(214deg) brightness(98%) contrast(96%);
    }

    .help-body .help-download-icon:hover {
      background: rgba(37, 99, 235, 0.15);
      text-decoration: none !important;
    }

    .help-body .help-download-icon:hover img {
      filter: brightness(0) saturate(100%) invert(21%) sepia(95%) saturate(2878%) hue-rotate(214deg) brightness(92%) contrast(96%);
    }

    .help-body li.nested {
      margin-left: 1.2em;
      list-style: circle;
    }

    .help-body p { margin: 0.6em 0; }
    .help-body ul { margin: 0.6em 0; padding-left: 1.4em; }
    .help-body li { margin: 0.35em 0; }
    .help-body strong { color: #f8fafc; font-weight: 600; }

    .help-body blockquote {
      margin: 0.8em 0;
      padding: 10px 14px;
      border-left: 3px solid #2563eb;
      background: rgba(37, 99, 235, 0.1);
      border-radius: 0 8px 8px 0;
      color: #94a3b8;
    }

    .help-body pre {
      margin: 0.8em 0;
      padding: 12px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.82rem;
      line-height: 1.5;
      color: #94a3b8;
    }

    .help-body code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.88em;
      background: #0f172a;
      padding: 0.1em 0.35em;
      border-radius: 4px;
      color: #7dd3fc;
    }

    .help-body pre code {
      background: none;
      padding: 0;
      color: inherit;
    }

    .help-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.8em 0;
      font-size: 0.88rem;
    }

    .help-body th,
    .help-body td {
      border: 1px solid #334155;
      padding: 8px 12px;
      text-align: left;
    }

    .help-body th {
      background: #0f172a;
      color: #e2e8f0;
      font-weight: 600;
    }

    .folder-import-dialog {
      width: min(480px, 100%);
    }

    .folder-import-body {
      padding: 16px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .folder-import-tip {
      margin: 0;
      font-size: 0.82rem;
      line-height: 1.6;
      color: #94a3b8;
    }

    .folder-import-list {
      list-style: none;
      margin: 0;
      padding: 0;
      min-height: 88px;
      max-height: 240px;
      overflow-y: auto;
      border: 1px dashed #334155;
      border-radius: 8px;
      background: #0f172a;
    }

    .folder-import-list:empty::before {
      content: '尚未添加文件夹';
      display: block;
      padding: 32px 16px;
      text-align: center;
      color: #64748b;
      font-size: 0.85rem;
    }

    .folder-import-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid #1e293b;
    }

    .folder-import-item:last-child { border-bottom: none; }

    .folder-import-item-name {
      flex: 1;
      min-width: 0;
      font-size: 0.88rem;
      color: #e2e8f0;
    }

    .folder-import-item-key {
      margin-top: 2px;
      font-size: 0.75rem;
      color: #64748b;
    }

    .btn-folder-import-remove {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
    }

    .btn-folder-import-remove:hover {
      background: rgba(69, 10, 10, 0.5);
      color: #fca5a5;
    }

    .folder-import-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .btn-folder-import-add,
    .btn-folder-import-confirm,
    .btn-folder-import-cancel {
      padding: 8px 14px;
      font-size: 0.85rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-folder-import-add {
      margin-right: auto;
      background: #334155;
      color: #e2e8f0;
    }

    .btn-folder-import-add:hover { background: #475569; }

    .btn-folder-import-confirm {
      background: #2563eb;
      color: #fff;
    }

    .btn-folder-import-confirm:hover:not(:disabled) { background: #1d4ed8; }

    .btn-folder-import-confirm:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-folder-import-cancel {
      background: transparent;
      color: #94a3b8;
    }

    .btn-folder-import-cancel:hover {
      background: #334155;
      color: #e2e8f0;
    }

    .header-logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .header h1 { font-size: 1.25rem; }

    .layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .sidebar {
      width: 280px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: #0b1220;
      min-width: 180px;
      max-width: 600px;
      transition: background 0.2s, outline-color 0.2s;
    }

    .sidebar.dragover {
      background: rgba(56, 189, 248, 0.06);
      outline: 2px dashed #38bdf8;
      outline-offset: -2px;
    }

    .sidebar-resizer {
      width: 5px;
      flex-shrink: 0;
      cursor: col-resize;
      background: #1e293b;
      position: relative;
      transition: background 0.15s;
    }

    .sidebar-resizer::before {
      content: '';
      position: absolute;
      left: -4px;
      right: -4px;
      top: 0;
      bottom: 0;
    }

    .sidebar-resizer:hover,
    .sidebar-resizer.dragging {
      background: #38bdf8;
    }

    body.resizing {
      cursor: col-resize;
      user-select: none;
    }

    body.resizing iframe,
    body.resizing video {
      pointer-events: none;
    }

    .sidebar-header {
      padding: 14px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sidebar-header h2 {
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex: 1;
      min-width: 0;
    }

    .sidebar-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-add,
    .btn-locate,
    .btn-clear,
    .btn-refresh,
    .btn-sort {
      padding: 4px 10px;
      font-size: 0.8rem;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #e2e8f0;
      cursor: pointer;
    }

    .btn-add:hover,
    .btn-locate:hover,
    .btn-refresh:hover,
    .btn-sort:hover { background: rgba(51, 65, 85, 0.5); }

    .btn-locate:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-locate:disabled:hover { background: transparent; }

    .btn-refresh:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-refresh:disabled:hover { background: transparent; }

    .btn-refresh.loading {
      opacity: 1;
      cursor: wait;
      background: rgba(37, 99, 235, 0.15);
    }

    .btn-refresh.loading .btn-icon-img {
      animation: refresh-spin 0.9s linear infinite;
    }

    @keyframes refresh-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .sidebar-list-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .refresh-loading {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(11, 18, 32, 0.78);
      backdrop-filter: blur(2px);
      z-index: 5;
    }

    .refresh-loading.visible {
      display: flex;
    }

    .refresh-loading-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .refresh-loading-icon {
      width: 28px;
      height: 28px;
      animation: refresh-spin 0.9s linear infinite;
    }

    .btn-sort.active {
      background: rgba(37, 99, 235, 0.2);
      color: #93c5fd;
    }

    .btn-clear {
      color: #fca5a5;
    }

    .btn-clear:hover { background: rgba(69, 10, 10, 0.5); }

    .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
    }

    .btn-icon-img {
      width: 16px;
      height: 16px;
      object-fit: contain;
      pointer-events: none;
      display: block;
    }

    .sidebar-search {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 16px 8px;
      background: #0b1220;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      height: 28px;
      padding: 0 10px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 0.8rem;
      outline: none;
    }

    .search-input::placeholder { color: #64748b; }

    .search-input:hover { border-color: #475569; }

    .search-input:focus { border-color: #3b82f6; }

    .search-input::-webkit-search-cancel-button { display: none; }

    .btn-search-clear {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #94a3b8;
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
    }

    .btn-search-clear:hover {
      background: rgba(51, 65, 85, 0.5);
      color: #e2e8f0;
    }

    .file-list-empty {
      text-align: center;
      color: #64748b;
      font-size: 0.85rem;
      padding: 32px 12px;
      line-height: 1.6;
    }

    .file-list {
      flex: 1;
      overflow-y: auto;
      padding: 0px 8px 12px;
      list-style: none;
      min-height: 0;
      background: #0b1220;
      scrollbar-width: thin;
      scrollbar-color: #334155 transparent;
    }

    .file-list::-webkit-scrollbar {
      width: 6px;
    }

    .file-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .file-list::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }

    .file-list::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    .file-list:empty::after {
      content: '拖拽文件夹或音视频到此处\A 或点击添加 / 添加文件夹';
      white-space: pre;
      display: block;
      text-align: center;
      color: #475569;
      font-size: 0.85rem;
      padding: 32px 12px;
      line-height: 1.6;
      cursor: pointer;
    }

    .folder-group {
      margin-bottom: 4px;
    }

    .folder-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
      position: sticky;
      top: 0;
      z-index: 2;
      background: #0b1220;
      box-shadow: 0 1px 0 #1e293b;
    }

    .folder-header:hover { background: #1e293b; }

    .folder-chevron {
      flex-shrink: 0;
      width: 12px;
      font-size: 0.7rem;
      color: #64748b;
      transition: transform 0.15s;
    }

    .folder-group.collapsed .folder-chevron {
      transform: rotate(-90deg);
    }

    .folder-name {
      flex: 1;
      min-width: 0;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .folder-count {
      flex-shrink: 0;
      font-size: 0.72rem;
      color: #64748b;
    }

    .btn-folder-clear {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
    }

    .folder-header:hover .btn-folder-clear { opacity: 1; }

    .btn-folder-clear img {
      width: 14px;
      height: 14px;
      pointer-events: none;
    }

    .btn-folder-clear:hover { background: rgba(69, 10, 10, 0.5); }

    .folder-items {
      list-style: none;
    }

    .folder-group.collapsed .folder-items {
      display: none;
    }

    .folder-items .file-item {
      padding-left: 18px;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 2px;
    }

    .file-item:hover { background: #1e293b; }

    .file-item.active {
      background: #1d4ed8;
    }

    .file-item.active .file-meta { color: #bfdbfe; }

    .file-icon {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      background-color: #334155;
      color: #94a3b8;
      overflow: hidden;
      position: relative;
    }

    .file-icon .icon-thumb,
    .player-badge .icon-thumb {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: inherit;
    }

    .file-item.active .file-icon:not(.has-thumb) {
      background-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .file-icon.video { background-color: #312e81; color: #a5b4fc; }
    .file-icon.audio { background-color: #14532d; color: #86efac; }
    .file-icon.has-thumb {
      background-color: #1e293b;
      color: transparent;
    }
    .file-item.active .file-icon.video:not(.has-thumb),
    .file-item.active .file-icon.audio:not(.has-thumb) {
      background-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }
    .file-item.active .file-icon.has-thumb {
      background-color: #1e293b;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.85);
      color: transparent;
    }

    .file-details {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-size: 0.88rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 2px;
    }

    .btn-remove {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
    }

    .file-item:hover .btn-remove { opacity: 1; }
    .btn-remove:hover { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-width: 0;
      overflow-y: auto;
    }

    .empty-state {
      text-align: center;
      color: #64748b;
    }

    .empty-state p { margin-top: 8px; font-size: 0.9rem; }

    .player-wrap {
      width: min(720px, 100%);
      display: none;
    }

    .player-wrap.active { display: block; }

    .player-card {
      background: linear-gradient(180deg, #1e293b 0%, #172033 100%);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px 24px 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .player-now-playing {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid #334155;
    }

    .player-badge {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      overflow: hidden;
      position: relative;
    }

    .player-badge.video {
      background-color: #312e81;
      color: #a5b4fc;
    }

    .player-badge.audio {
      background-color: #14532d;
      color: #86efac;
    }

    .player-badge.has-thumb {
      background-color: #1e293b;
      color: transparent;
    }

    .player-meta {
      flex: 1;
      min-width: 0;
    }

    .player-label {
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 4px;
    }

    .player-title {
      font-size: 1rem;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.4;
      word-break: break-all;
    }

    .player-size {
      margin-top: 6px;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .player-media {

<body>
  <header class="header">

  <script>
    const layout = document.querySelector('.layout');

    const ICON_PATHS = {

    };

    try {
      const savedCollapsed = JSON.parse(localStorage.getItem(COLLAPSED_FOLDERS_KEY) || '[]');
      if (Array.isArray(savedCollapsed)) collapsedFolders = new Set(savedCollapsed);
    } catch {
      collapsedFolders = new Set();

    function persistCollapsedFolders() {
      localStorage.setItem(COLLAPSED_FOLDERS_KEY, JSON.stringify([...collapsedFolders]));
    }

    function getFolderFromFile(file) {
      const path = file.webkitRelativePath || '';
      if (!path || !path.includes('/')) return UNGROUPED_FOLDER;
      const parts = path.split('/');
      parts.pop();
      return parts.join('/') || UNGROUPED_FOLDER;
    }

    function getMediaFileKey(name, folder, size) {
      return `${folder || UNGROUPED_FOLDER}\0${name}\0${size}`;
    }

    function getNormalizedFolder(folder) {
      if (!folder || folder === UNGROUPED_FOLDER) return UNGROUPED_FOLDER;
      const canonicalTop = getFolderBaseName(folder.split('/')[0]);
      return normalizeFolderPath(folder, canonicalTop);
    }

    function getFileKey(file) {
      return getMediaFileKey(file.name, getNormalizedFolder(getFolderFromFile(file)), file.size);
    }

    function readDirectoryEntry(entry, basePath = '') {
      return new Promise((resolve) => {
        if (entry.isFile) {
          entry.file((file) => {
            const relativePath = basePath ? `${basePath}/${file.name}` : file.name;
            try {
              Object.defineProperty(file, 'webkitRelativePath', {
                value: relativePath,
                configurable: true,
              });
            } catch (_) {}
            resolve([file]);
          }, () => resolve([]));
          return;
        }

        if (!entry.isDirectory) {
          resolve([]);
          return;
        }

        const dirPath = basePath ? `${basePath}/${entry.name}` : entry.name;
        const reader = entry.createReader();
        const entries = [];

        const readBatch = () => {
          reader.readEntries(async (batch) => {
            if (!batch.length) {
              const nested = await Promise.all(entries.map((child) => readDirectoryEntry(child, dirPath)));
              resolve(nested.flat());
              return;
            }
            entries.push(...batch);
            readBatch();
          }, () => resolve([]));
        };

        readBatch();
      });
    }

    async function getFilesFromDrop(dataTransfer) {
      const items = [...dataTransfer.items].filter((item) => item.kind === 'file');
      if (!items.length) return [...dataTransfer.files];

      const hasEntry = items.some((item) => typeof item.webkitGetAsEntry === 'function');
      if (!hasEntry) return [...dataTransfer.files];

      const groups = await Promise.all(items.map((item) => {
        const entry = item.webkitGetAsEntry();
        return entry ? readDirectoryEntry(entry) : [];
      }));
      const files = groups.flat();
      return files.length ? files : [...dataTransfer.files];
    }

    function openDB() {
      if (!dbPromise) {
        dbPromise = new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onerror = () => reject(request.error);
          request.onsuccess = () => resolve(request.result);
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              const store = db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
              store.createIndex('addedAt', 'addedAt', { unique: false });
            }
            if (!db.objectStoreNames.contains(FOLDER_HANDLES_STORE)) {
              db.createObjectStore(FOLDER_HANDLES_STORE, { keyPath: 'folder' });
            }
          };
        });
      }
      return dbPromise;
    }

    function dbAddFile(file, duration = 0, folder = UNGROUPED_FOLDER) {
      return openDB().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const record = {
          name: file.name,
          type: isVideo(file) ? 'video' : 'audio',
          size: file.size,
          mimeType: file.type || '',
          blob: file,
          duration: duration || 0,
          folder: folder || UNGROUPED_FOLDER,
          addedAt: Date.now(),
        };
        const req = store.add(record);
        req.onsuccess = () => resolve({ ...record, id: req.result });
        req.onerror = () => reject(req.error);
      }));
    }

    function dbDeleteFile(id) {
      return openDB().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const req = tx.objectStore(STORE_NAME).delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      }));
    }

    function dbGetAllFiles() {
      return openDB().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).getAll();
        req.onsuccess = () => {
          resolve(req.result.sort((a, b) => a.addedAt - b.addedAt));
        };
        req.onerror = () => reject(req.error);
      }));
    }

    function dbClearAll() {
      return openDB().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const req = tx.objectStore(STORE_NAME).clear();
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      }));
    }

    function dbSaveFolderHandle(folder, handle) {
      return openDB().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(FOLDER_HANDLES_STORE, 'readwrite');
        const req = tx.objectStore(FOLDER_HANDLES_STORE).put({ folder, handle });
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      }));
    }

    function dbDeleteFolderHandle(folder) {
      return openDB().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(FOLDER_HANDLES_STORE, 'readwrite');
        const req = tx.objectStore(FOLDER_HANDLES_STORE).delete(folder);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      }));
    }

    function dbGetAllFolderHandles() {
      return openDB().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(FOLDER_HANDLES_STORE, 'readonly');
        const req = tx.objectStore(FOLDER_HANDLES_STORE).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      }));
    }

    function dbClearFolderHandles() {
      return openDB().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(FOLDER_HANDLES_STORE, 'readwrite');
        const req = tx.objectStore(FOLDER_HANDLES_STORE).clear();
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      }));
    }

    function dbUpdateItemFolder(id, folder) {
      return openDB().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const getReq = store.get(id);
        getReq.onsuccess = () => {
          const record = getReq.result;
          if (!record) {
            resolve(null);
            return;
          }
          record.folder = folder;
          const putReq = store.put(record);
          putReq.onsuccess = () => resolve(record);
          putReq.onerror = () => reject(putReq.error);
        };
        getReq.onerror = () => reject(getReq.error);
      }));
    }

    async function readDirectoryHandle(dirHandle, basePath = '') {
      const files = [];
      for await (const [name, handle] of dirHandle.entries()) {
        if (handle.kind === 'file') {
          const file = await handle.getFile();
          const relativePath = basePath ? `${basePath}/${name}` : name;
          try {
            Object.defineProperty(file, 'webkitRelativePath', {
              value: relativePath,
              configurable: true,
            });
          } catch (_) {}
          files.push(file);
        } else if (handle.kind === 'directory') {
          const subPath = basePath ? `${basePath}/${name}` : name;
          const subFiles = await readDirectoryHandle(handle, subPath);
          files.push(...subFiles);
        }
      }
      return files;
    }

    async function ensureHandlePermission(handle) {
      const permission = await handle.queryPermission({ mode: 'read' });
      if (permission === 'granted') return true;
      const requested = await handle.requestPermission({ mode: 'read' });
      return requested === 'granted';
    }

    async function saveFolderHandle(folder, handle) {
      folderHandles.set(folder, handle);
      await dbSaveFolderHandle(folder, handle);
    }

    function loadFolderHandles() {
      return dbGetAllFolderHandles()
        .then((records) => {
          folderHandles.clear();
          records.forEach((record) => {
            if (record.folder && record.handle) {
              const canonical = getCanonicalFolderKey(record.folder);
              folderHandles.set(canonical, record.handle);
              if (canonical !== record.folder) {
                dbSaveFolderHandle(canonical, record.handle);
                dbDeleteFolderHandle(record.folder);
              }
            }
          });
          updateRefreshButton();
        })
        .catch(() => {});
    }

    function getLinkedFolders() {
      const keys = new Set();
      folderHandles.forEach((_, key) => keys.add(getCanonicalFolderKey(key)));
      return [...keys];
    }

    function getFolderBaseName(name) {
      const match = name.match(/^(.+) \((\d+)\)$/);
      return match ? match[1] : name;
    }

    function getCanonicalFolderKey(name) {
      return getFolderBaseName(name);
    }

    function normalizeFolderPath(folder, canonicalTop) {
      if (folder === UNGROUPED_FOLDER) return folder;
      const parts = folder.split('/');
      parts[0] = canonicalTop;
      return parts.join('/');
    }

    function topFoldersMatch(folderTopA, folderTopB) {
      return getFolderBaseName(folderTopA) === getFolderBaseName(folderTopB);
    }

    function itemBelongsToFolder(item, folderName) {
      const folder = item.folder || UNGROUPED_FOLDER;
      if (folder === UNGROUPED_FOLDER) return folderName === UNGROUPED_FOLDER;

      const itemTop = folder.split('/')[0];
      const targetTop = folderName.split('/')[0];
      if (!topFoldersMatch(itemTop, targetTop)) return false;

      const canonicalTop = getFolderBaseName(targetTop);
      const normalizedItemFolder = normalizeFolderPath(folder, canonicalTop);
      const normalizedTarget = normalizeFolderPath(folderName, canonicalTop);
      return normalizedItemFolder === normalizedTarget || normalizedItemFolder.startsWith(`${normalizedTarget}/`);
    }

    function fileBelongsToFolder(file, folderName) {
      const folder = getFolderFromFile(file);
      if (folder === UNGROUPED_FOLDER) return folderName === UNGROUPED_FOLDER;

      const fileTop = folder.split('/')[0];
      const targetTop = folderName.split('/')[0];
      if (!topFoldersMatch(fileTop, targetTop)) return false;

      const canonicalTop = getFolderBaseName(targetTop);
      const normalizedFileFolder = normalizeFolderPath(folder, canonicalTop);
      const normalizedTarget = normalizeFolderPath(folderName, canonicalTop);
      return normalizedFileFolder === normalizedTarget || normalizedFileFolder.startsWith(`${normalizedTarget}/`);
    }

    function getNameFolderKey(name, folder) {
      return `${folder || UNGROUPED_FOLDER}\0${name}`;
    }

    function isFolderKeyInUse(folderKey, extraKeys = []) {
      const canonical = getCanonicalFolderKey(folderKey);
      if (folderHandles.has(canonical) || folderHandles.has(folderKey)) return true;
      if (extraKeys.includes(canonical) || extraKeys.includes(folderKey)) return true;
      return mediaItems.some((item) => itemBelongsToFolder(item, canonical));
    }

    function getTopLevelFolder(item) {
      const folder = item.folder || UNGROUPED_FOLDER;
      if (folder === UNGROUPED_FOLDER) return UNGROUPED_FOLDER;
      return folder.split('/')[0];
    }

    function groupFilesByTopFolder(files) {
      const groups = new Map();
      Array.from(files).forEach((file) => {
        const path = file.webkitRelativePath || '';
        const topFolder = path.includes('/') ? path.split('/')[0] : UNGROUPED_FOLDER;
        if (!groups.has(topFolder)) groups.set(topFolder, []);
        groups.get(topFolder).push(file);
      });
      return groups;
    }

    async function pickFolderHandle(expectedFolder = null) {
      if (!window.showDirectoryPicker) return null;
      const handle = await window.showDirectoryPicker();
      if (expectedFolder && handle.name !== expectedFolder) {
        const label = expectedFolder === UNGROUPED_FOLDER ? '未分组' : expectedFolder;
        const proceed = confirm(`所选文件夹「${handle.name}」与当前目录「${label}」不一致，仍要刷新吗？`);
        if (!proceed) return null;
      }
      return handle;
    }

    async function resolveFolderHandle(folderName) {
      const canonical = getCanonicalFolderKey(folderName);
      let handle = folderHandles.get(canonical) || folderHandles.get(folderName);
      if (!handle) {
        for (const [key, value] of folderHandles.entries()) {
          if (getCanonicalFolderKey(key) === canonical) {
            handle = value;
            break;
          }
        }
      }
      if (handle) return handle;
      handle = await pickFolderHandle(canonical);
      if (!handle) return null;
      await saveFolderHandle(canonical, handle);
      return handle;
    }

    async function syncFolderFromHandle(folderName, handle) {
      const allowed = await ensureHandlePermission(handle);
      if (!allowed) throw new Error('permission denied');

      const canonicalTop = getCanonicalFolderKey(folderName);
      const allFiles = await readDirectoryHandle(handle, canonicalTop);
      const scopedFiles = allFiles.filter((file) => fileBelongsToFolder(file, canonicalTop));
      const lrcFiles = scopedFiles.filter(isLrc);
      const coverImages = scopedFiles.filter(isCoverImage);
      const mediaFiles = scopedFiles.filter((file) => !isLrc(file) && !isCoverImage(file) && isSupported(file));

      const diskMediaByNameFolder = new Map();
      mediaFiles.forEach((file) => {
        diskMediaByNameFolder.set(getNameFolderKey(file.name, getFolderFromFile(file)), file);
      });

      const existingItems = mediaItems.filter((item) => itemBelongsToFolder(item, canonicalTop));
      const toRemove = [];
      const toAdd = [...mediaFiles];

      existingItems.forEach((item) => {
        const normalizedFolder = normalizeFolderPath(item.folder, canonicalTop);
        const key = getNameFolderKey(item.name, normalizedFolder);
        const diskFile = diskMediaByNameFolder.get(key);
        if (!diskFile) {
          toRemove.push(item);
          return;
        }
        if (diskFile.size !== item.size) {
          toRemove.push(item);
          return;
        }
        const addIndex = toAdd.indexOf(diskFile);
        if (addIndex !== -1) toAdd.splice(addIndex, 1);
      });

      await Promise.all(toRemove.map((item) => dbDeleteFile(item.id)));
      toRemove.forEach((item) => {
        const index = mediaItems.findIndex((m) => m.id === item.id);
        if (index !== -1) {
          const [removed] = mediaItems.splice(index, 1);
          revokeItemUrls(removed);
          removeSavedPosition(item.id);
          removeCompleted(item.id);
          if (activeId === item.id) {
            activeId = null;
            saveActiveId();
            stopPlayback();
            showIdleView();
            clearPlayerInfo();
          }
        }
      });

      if (toAdd.length) {
        const coverMap = buildCoverImageMap(coverImages);
        const items = await Promise.all(toAdd.map((file) => {
          const coverEntry = coverMap.get(getCoverLookupKeyFromFile(file));
          return addMediaFile(file, coverEntry?.file || null);
        }));
        items.forEach((item) => mediaItems.push(item));
      }

      if (lrcFiles.length) await processLrcFiles(lrcFiles);
      if (coverImages.length) await processCoverImages(coverImages);
      await normalizeSuffixedItemFolders(canonicalTop);
    }

    async function normalizeSuffixedItemFolders(canonicalTop) {
      const items = mediaItems.filter((item) => {
        const top = getTopLevelFolder(item);
        return getFolderBaseName(top) === canonicalTop && top !== canonicalTop;
      });
      if (!items.length) return;

      await Promise.all(items.map((item) => {
        const newFolder = normalizeFolderPath(item.folder, canonicalTop);
        if (newFolder === item.folder) return Promise.resolve();
        item.folder = newFolder;
        return dbUpdateItemFolder(item.id, newFolder);
      }));
    }

    async function migrateFolderTopName(fromTop, toTop) {
      const items = mediaItems.filter((item) => getTopLevelFolder(item) === fromTop);
      await Promise.all(items.map((item) => {
        const newFolder = normalizeFolderPath(item.folder, toTop);
        item.folder = newFolder;
        return dbUpdateItemFolder(item.id, newFolder);
      }));

      if (folderHandles.has(fromTop)) {
        const handle = folderHandles.get(fromTop);
        folderHandles.delete(fromTop);
        await dbDeleteFolderHandle(fromTop).catch(() => {});
        if (handle) await saveFolderHandle(toTop, handle);
      }
    }

    async function verifyFolderHandle(handle) {
      try {
        for await (const _ of handle.entries()) {
          break;
        }
        return true;
      } catch (err) {
        if (isFolderMissingError(err)) return false;
        throw err;
      }
    }

    function isFolderMissingError(err) {
      return err?.name === 'NotFoundError'
        || err?.name === 'InvalidStateError'
        || /not found|could not be found|no longer available|已被删除|不存在/i.test(err?.message || '');
    }

    async function refreshFolderEntry(folderName, handle, removedFolders) {
      const canonical = getCanonicalFolderKey(folderName);
      const accessible = await verifyFolderHandle(handle);
      if (!accessible) {
        await removeFolderItemsSilent(canonical);
        if (!removedFolders.includes(canonical)) removedFolders.push(canonical);
        return;
      }

      try {
        await syncFolderFromHandle(folderName, handle);
      } catch (err) {
        if (isFolderMissingError(err)) {
          await removeFolderItemsSilent(canonical);
          if (!removedFolders.includes(canonical)) removedFolders.push(canonical);
          return;
        }
        throw err;
      }
    }

    async function refreshLinkedFolders(folderNames = getLinkedFolders()) {
      const removedFolders = [];

      if (!folderNames.length) {
        if (!window.showDirectoryPicker) {
          alert('当前浏览器不支持目录刷新，请使用 Chrome 或 Edge，并通过「添加文件夹」导入');
          return;
        }

        const topFolders = [...new Set(
          mediaItems
            .map((item) => item.folder || UNGROUPED_FOLDER)
            .filter((folder) => folder !== UNGROUPED_FOLDER)
            .map((folder) => getCanonicalFolderKey(folder.split('/')[0])),
        )];

        if (!topFolders.length) {
          alert('请先通过「添加文件夹」导入目录，以便记录文件夹位置');
          return;
        }

        for (const folderName of topFolders) {
          const handle = await resolveFolderHandle(folderName);
          if (!handle) continue;
          await refreshFolderEntry(folderName, handle, removedFolders);
        }
        if (removedFolders.length) {
          alert(`以下目录已不存在，已从列表中移除：\n${removedFolders.join('\n')}`);
        }
        renderList();
        return;
      }

      for (const folderName of folderNames) {
        const handle = folderHandles.get(folderName) || await resolveFolderHandle(folderName);
        if (!handle) continue;
        await refreshFolderEntry(folderName, handle, removedFolders);
      }
      if (removedFolders.length) {
        alert(`以下目录已不存在，已从列表中移除：\n${removedFolders.join('\n')}`);
      }
      renderList();
    }

    async function removeFolderItemsSilent(folder) {
      const canonical = getCanonicalFolderKey(folder);
      const items = mediaItems.filter((item) => itemBelongsToFolder(item, canonical));
      if (!items.length) {
        for (const key of [...folderHandles.keys()]) {
          if (getCanonicalFolderKey(key) === canonical) {
            folderHandles.delete(key);
            await dbDeleteFolderHandle(key).catch(() => {});
          }
        }
        return;
      }

      await Promise.all(items.map((item) => dbDeleteFile(item.id)));
      const ids = new Set(items.map((item) => item.id));
      items.forEach((item) => {
        revokeItemUrls(item);
        removeSavedPosition(item.id);
        removeCompleted(item.id);
      });

      for (let i = mediaItems.length - 1; i >= 0; i -= 1) {
        if (ids.has(mediaItems[i].id)) mediaItems.splice(i, 1);
      }

      if (activeId !== null && ids.has(activeId)) {
        activeId = null;
        saveActiveId();
        stopPlayback();
        showIdleView();
        clearPlayerInfo();
      }

      for (const key of [...folderHandles.keys()]) {
        if (getCanonicalFolderKey(key) === canonical) {
          folderHandles.delete(key);
          await dbDeleteFolderHandle(key).catch(() => {});
        }
      }
    }

    async function cleanupSuffixedDuplicateFolders() {
      const topFolders = [...new Set(
        mediaItems.map(getTopLevelFolder).filter((folder) => folder !== UNGROUPED_FOLDER),
      )];

      const duplicateFolders = topFolders.filter((folder) => {
        const base = getFolderBaseName(folder);
        return base !== folder && topFolders.includes(base);
      });

      for (const folder of duplicateFolders) {
        await removeFolderItemsSilent(folder);
      }

      const suffixedOnly = topFolders.filter((folder) => {
        const base = getFolderBaseName(folder);
        return base !== folder && !topFolders.includes(base);
      });

      for (const folder of suffixedOnly) {
        await migrateFolderTopName(folder, getFolderBaseName(folder));
      }

      if (duplicateFolders.length || suffixedOnly.length) renderList();
    }

    function updateSidebarLoadingOverlay() {
      const busy = isRefreshing || isImporting;
      const message = isRefreshing ? '正在刷新目录…' : '正在导入文件…';

      if (sidebarLoadingText) sidebarLoadingText.textContent = message;
      if (refreshLoading) {
        refreshLoading.classList.toggle('visible', busy);
        refreshLoading.hidden = !busy;
        refreshLoading.setAttribute('aria-hidden', busy ? 'false' : 'true');
      }

      btnAdd.disabled = busy;
      btnAddFolder.disabled = busy;
      updateLocateButton();
    }

    function updateRefreshButton() {
      const hasLinkedFolders = folderHandles.size > 0
        || mediaItems.some((item) => (item.folder || UNGROUPED_FOLDER) !== UNGROUPED_FOLDER);

      btnRefresh.disabled = isRefreshing || isImporting || !hasLinkedFolders;
      btnRefresh.classList.toggle('loading', isRefreshing);
      btnRefresh.title = isRefreshing ? '正在刷新目录…' : '刷新目录';
      btnRefresh.setAttribute('aria-label', isRefreshing ? '正在刷新目录' : '刷新目录');
      updateSidebarLoadingOverlay();
    }

    async function handleRefreshClick() {
      if (isRefreshing) return;
      isRefreshing = true;
      updateRefreshButton();
      try {
        await refreshLinkedFolders();
      } catch (err) {
        if (err?.name !== 'AbortError') {
          alert(err?.message === 'permission denied' ? '需要文件夹读取权限才能刷新' : '刷新目录失败，请重试');
        }
      } finally {
        isRefreshing = false;
        updateRefreshButton();
      }
    }

    let pendingFolderImports = [];
    let folderImportViaInput = false;

    function renderFolderImportList() {
      const listEl = document.getElementById('folderImportList');
      const confirmBtn = document.getElementById('btnFolderImportConfirm');
      if (!listEl || !confirmBtn) return;

      listEl.innerHTML = '';
      pendingFolderImports.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = 'folder-import-item';

        const nameWrap = document.createElement('div');
        nameWrap.className = 'folder-import-item-name';

        const title = document.createElement('div');
        title.textContent = item.name;
        title.title = item.name;
        nameWrap.appendChild(title);

        if (item.folderKey !== item.name) {
          const key = document.createElement('div');
          key.className = 'folder-import-item-key';
          key.textContent = item.folderKey;
          nameWrap.appendChild(key);
        } else if (item.refresh) {
          const badge = document.createElement('div');
          badge.className = 'folder-import-item-key';
          badge.textContent = '更新已有目录';
          nameWrap.appendChild(badge);
        }

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'btn-folder-import-remove';
        removeBtn.title = '移除';
        removeBtn.setAttribute('aria-label', '移除');
        removeBtn.textContent = '×';
        removeBtn.addEventListener('click', () => {
          pendingFolderImports.splice(index, 1);
          renderFolderImportList();
        });

        li.appendChild(nameWrap);
        li.appendChild(removeBtn);
        listEl.appendChild(li);
      });

      confirmBtn.disabled = pendingFolderImports.length === 0;
    }

    function openFolderImportModal() {
      pendingFolderImports = [];
      renderFolderImportList();
      const overlay = document.getElementById('folderImportOverlay');
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
    }

    function closeFolderImportModal() {
      pendingFolderImports = [];
      renderFolderImportList();
      const overlay = document.getElementById('folderImportOverlay');
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
    }

    async function addPendingFolderFromHandle(handle) {
      if (handle.isSameEntry) {
        for (const item of pendingFolderImports) {
          if (item.handle && await item.handle.isSameEntry(handle)) {
            alert(`文件夹「${handle.name}」已在待导入列表中`);
            return;
          }
        }
      }
      if (pendingFolderImports.some((item) => item.name === handle.name)) {
        alert(`文件夹「${handle.name}」已在待导入列表中`);
        return;
      }

      const files = await readDirectoryHandle(handle, handle.name);
      if (!folderHasMediaFiles(files)) {
        alert('不存在音频文件');
        return;
      }

      pendingFolderImports.push({
        folderKey: getCanonicalFolderKey(handle.name),
        name: handle.name,
        handle,
        refresh: isFolderKeyInUse(handle.name),
      });
      renderFolderImportList();
    }

    function addPendingFolderFromFiles(files) {
      const groups = groupFilesByTopFolder(files);
      if (!groups.size) {
        alert('未读取到文件夹内容');
        return;
      }

      let addedCount = 0;
      let noMediaCount = 0;
      groups.forEach((groupFiles, topName) => {
        if (topName === UNGROUPED_FOLDER) return;
        if (pendingFolderImports.some((item) => item.name === topName)) return;
        if (!folderHasMediaFiles(groupFiles)) {
          noMediaCount += 1;
          return;
        }

        pendingFolderImports.push({
          folderKey: getCanonicalFolderKey(topName),
          name: topName,
          files: groupFiles,
          refresh: isFolderKeyInUse(topName),
        });
        addedCount += 1;
      });

      if (!addedCount) {
        if (noMediaCount > 0) {
          alert('不存在音频文件');
        } else {
          alert('请选择包含媒体文件的文件夹');
        }
        return;
      }

      renderFolderImportList();
    }

    async function pickFolderForImportModal() {
      if (window.showDirectoryPicker) {
        try {
          const handle = await window.showDirectoryPicker();
          await addPendingFolderFromHandle(handle);
        } catch (err) {
          if (err?.name !== 'AbortError') {
            alert('无法打开文件夹，请重试');
          }
        }
        return;
      }

      folderImportViaInput = true;
      folderInput.click();
    }

    async function importPendingFolders() {
      if (!pendingFolderImports.length || isImporting) return;

      const imports = [...pendingFolderImports];
      closeFolderImportModal();

      isImporting = true;
      updateSidebarLoadingOverlay();
      updateRefreshButton();

      try {
        for (const item of imports) {
          if (item.handle) {
            await saveFolderHandle(item.folderKey, item.handle);
            if (item.refresh) {
              await syncFolderFromHandle(item.folderKey, item.handle);
            } else {
              const files = await readDirectoryHandle(item.handle, item.folderKey);
              await addFiles(files);
            }
          } else if (item.files?.length) {
            await addFiles(item.files);
          }
        }
        renderList();
        updateRefreshButton();
        await cleanupSuffixedDuplicateFolders();
      } catch (err) {
        alert('导入文件夹失败，请重试');
      } finally {
        isImporting = false;
        updateSidebarLoadingOverlay();
        updateRefreshButton();
      }
    }

    async function importFilesWithLoading(files) {
      if (isImporting || isRefreshing) return addFiles(files);

      isImporting = true;
      updateSidebarLoadingOverlay();
      updateRefreshButton();

      try {
        await addFiles(files);
      } finally {
        isImporting = false;
        updateSidebarLoadingOverlay();
        updateRefreshButton();
      }
    }

    function syncSafeInt(view, offset, size) {
      let result = 0;
      for (let i = 0; i < size; i += 1) {
        result = (result << 7) | (view.getUint8(offset + i) & 0x7f);
      }
      return result;
    }

    function extractMp3Cover(file) {
      const headSize = Math.min(file.size, 512 * 1024);
      return file.slice(0, headSize).arrayBuffer().then((buffer) => {
        const bytes = new Uint8Array(buffer);
        if (bytes.length < 10 || bytes[0] !== 0x49 || bytes[1] !== 0x44 || bytes[2] !== 0x33) {
          return null;
        }

        const view = new DataView(buffer);
        const majorVersion = view.getUint8(3);
        const tagSize = syncSafeInt(view, 6, 4);
        let offset = 10;
        const end = Math.min(10 + tagSize, bytes.length);

        while (offset + 10 <= end) {
          const frameId = String.fromCharCode(bytes[offset], bytes[offset + 1], bytes[offset + 2], bytes[offset + 3]);
          const frameSize = majorVersion === 4
            ? syncSafeInt(view, offset + 4, 4)
            : view.getUint32(offset + 4, false);
          offset += 10;
          if (frameSize <= 0 || offset + frameSize > end) break;

          if (frameId === 'APIC' || frameId === 'PIC ') {
            let pos = offset;
            const encoding = bytes[pos];
            pos += 1;

            while (pos < offset + frameSize && bytes[pos] !== 0) pos += 1;
            const mimeStart = offset + 1;
            const mime = String.fromCharCode(...bytes.slice(mimeStart, pos)).toLowerCase() || 'image/jpeg';
            pos += 1;
            pos += 1;

            if (encoding === 1 || encoding === 2) {
              while (pos + 1 < offset + frameSize && !(bytes[pos] === 0 && bytes[pos + 1] === 0)) pos += 2;
              pos += 2;
            } else {
              while (pos < offset + frameSize && bytes[pos] !== 0) pos += 1;
              pos += 1;
            }

            const imageData = bytes.slice(pos, offset + frameSize);
            if (imageData.length > 0) {
              const type = mime.startsWith('image/') ? mime : 'image/jpeg';
              return new Blob([imageData], { type });
            }
          }

          offset += frameSize;
        }

        return null;
      }).catch(() => null);
    }

    function captureVideoThumbnail(file) {
      return new Promise((resolve) => {
        const video = document.createElement('video');
        video.preload = 'auto';
        video.muted = true;
        video.playsInline = true;
        const url = URL.createObjectURL(file);

        const finish = (blob) => {
          video.removeAttribute('src');
          video.load();
          URL.revokeObjectURL(url);
          resolve(blob);
        };

        video.addEventListener('error', () => finish(null));
        video.addEventListener('loadedmetadata', () => {
          const duration = video.duration;
          video.currentTime = Number.isFinite(duration) && duration > 1
            ? Math.min(1, duration * 0.05)
            : 0;
        });
        video.addEventListener('seeked', () => {
          try {
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            if (!vw || !vh) {
              finish(null);
              return;
            }
            const size = 128;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const scale = Math.max(size / vw, size / vh);
            const dw = vw * scale;
            const dh = vh * scale;
            ctx.drawImage(video, (size - dw) / 2, (size - dh) / 2, dw, dh);
            canvas.toBlob((blob) => finish(blob), 'image/jpeg', 0.82);
          } catch {
            finish(null);
          }
        }, { once: true });

        video.src = url;
      });
    }

    function generateMediaThumbnail(file, type, companionCover = null) {
      if (companionCover) return coverFileToBlob(companionCover);
      if (type === 'video') return captureVideoThumbnail(file);
      if (/\.mp3$/i.test(file.name) || file.type === 'audio/mpeg') return extractMp3Cover(file);
      return Promise.resolve(null);
    }

    function coverFileToBlob(file) {
      if (!file) return Promise.resolve(null);
      return file.arrayBuffer().then((buf) => new Blob([buf], { type: file.type || 'image/jpeg' }));
    }

    function attachThumbnailToItem(item, thumbnailBlob) {
      if (!thumbnailBlob) return item;
      if (item.thumbnailUrl) URL.revokeObjectURL(item.thumbnailUrl);
      item.thumbnailBlob = thumbnailBlob;
      item.thumbnailUrl = URL.createObjectURL(thumbnailBlob);
      return item;
    }

    function isCoverImage(file) {
      if (file.type.startsWith('image/')) return true;
      return /\.(webp|jpe?g|png|gif|bmp|avif)$/i.test(file.name);
    }

    function normalizeMatchName(filename) {
      return getBaseName(filename)
        .normalize('NFC')
        .replace(/（/g, '(')
        .replace(/）/g, ')')
        .replace(/[－—–]/g, '-')
        .trim();
    }

    function getCoverLookupKey(name, folder) {
      return `${folder || UNGROUPED_FOLDER}\0${normalizeMatchName(name)}`;
    }

    function getCoverLookupKeyFromFile(file) {
      return getCoverLookupKey(file.name, getFolderFromFile(file));
    }

    function buildCoverImageMap(imageFiles) {
      const map = new Map();
      const extPriority = { '.webp': 0, '.png': 1, '.jpg': 2, '.jpeg': 2, '.gif': 3, '.bmp': 4, '.avif': 5 };

      imageFiles.forEach((file) => {
        const key = getCoverLookupKeyFromFile(file);
        const dot = file.name.lastIndexOf('.');
        const ext = dot >= 0 ? file.name.slice(dot).toLowerCase() : '';
        const existing = map.get(key);
        if (!existing || (extPriority[ext] ?? 99) < (extPriority[existing.ext] ?? 99)) {
          map.set(key, { file, ext });
        }
      });

      return map;
    }

    function findMediaItemForCover(file) {
      const baseName = normalizeMatchName(file.name);
      const folder = getFolderFromFile(file);
      return mediaItems.find((m) => normalizeMatchName(m.name) === baseName && m.folder === folder)
        || mediaItems.find((m) => normalizeMatchName(m.name) === baseName);
    }

    function recordToItem(record) {
      const file = new File([record.blob], record.name, {
        type: record.mimeType || (record.type === 'video' ? 'video/mp4' : 'audio/mpeg'),
      });
      const item = {
        id: record.id,
        file,
        objectUrl: URL.createObjectURL(record.blob),
        name: record.name,
        type: record.type,
        size: record.size,
        duration: record.duration || 0,
        folder: record.folder || UNGROUPED_FOLDER,
        subtitleLrc: record.subtitleLrc || '',
        subtitleLines: parseLRC(record.subtitleLrc || ''),
      };
      if (record.thumbnailBlob) {
        item.thumbnailBlob = record.thumbnailBlob;
        item.thumbnailUrl = URL.createObjectURL(record.thumbnailBlob);
      }
      return item;
    }

    function getBaseName(filename) {
      const dot = filename.lastIndexOf('.');
      return dot > 0 ? filename.slice(0, dot) : filename;
    }

    function isLrc(file) {
      return /\.lrc$/i.test(file.name);
    }

    function parseLRC(text) {
      if (!text) return [];
      const lines = [];
      const tagRegex = /\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]/g;

      text.split(/\r?\n/).forEach((rawLine) => {
        const line = rawLine.trim();
        if (!line) return;

        const times = [];
        let match;
        tagRegex.lastIndex = 0;
        while ((match = tagRegex.exec(line)) !== null) {
          const min = parseInt(match[1], 10);
          const sec = parseInt(match[2], 10);
          let frac = match[3] ? parseInt(match[3], 10) : 0;
          if (match[3]) {
            if (match[3].length === 1) frac *= 100;
            else if (match[3].length === 2) frac *= 10;
          }
          times.push(min * 60 + sec + frac / 1000);
        }

        const content = line.replace(/\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]/g, '').trim();
        if (!content) return;
        times.forEach((time) => lines.push({ time, text: content }));
      });

      return lines.sort((a, b) => a.time - b.time);
    }

    function renderSubtitleLines(lines) {
      subtitleLines.innerHTML = '';
      lines.forEach((line, index) => {
        const el = document.createElement('div');
        el.className = 'subtitle-line';
        el.dataset.index = index;
        el.dataset.time = line.time;

        const text = document.createElement('span');
        text.className = 'subtitle-line-text';
        text.textContent = line.text;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'subtitle-line-seek';
        btn.title = '跳转到此处';
        btn.setAttribute('aria-label', '跳转到此处');
        btn.textContent = '▶';

        el.appendChild(text);
        el.appendChild(btn);
        subtitleLines.appendChild(el);
      });
    }

    function clearSubtitles() {
      activeSubtitleIndex = -1;
      subtitleLines.innerHTML = '';
      subtitlePanel.classList.remove('visible');
      audioVisual.classList.remove('has-subtitle');
      if (audioVisualLabel) audioVisualLabel.style.display = '';
    }

    function loadSubtitlesForItem(item) {
      const lines = item?.subtitleLines || [];
      activeSubtitleIndex = -1;
      renderSubtitleLines(lines);
      const hasSubtitle = lines.length > 0;
      subtitlePanel.classList.toggle('visible', hasSubtitle);
      audioVisual.classList.toggle('has-subtitle', hasSubtitle && item?.type === 'audio');
      if (audioVisualLabel) {
        audioVisualLabel.style.display = hasSubtitle && item?.type === 'audio' ? 'none' : '';
      }
      if (!hasSubtitle) subtitleScroll.scrollTop = 0;
    }

    function updateSubtitles(currentTime) {
      const item = mediaItems.find((m) => m.id === activeId);
      const lines = item?.subtitleLines || [];
      if (!lines.length) return;

      let index = -1;
      for (let i = lines.length - 1; i >= 0; i -= 1) {
        if (currentTime >= lines[i].time) {
          index = i;
          break;
        }
      }

      if (index === activeSubtitleIndex) return;
      activeSubtitleIndex = index;

      const children = subtitleLines.children;
      for (let i = 0; i < children.length; i += 1) {
        children[i].classList.toggle('active', i === index);
        children[i].classList.toggle('passed', index >= 0 && i < index);
      }

      if (index >= 0 && children[index] && !isSubtitleHovered) {
        children[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function processCoverImages(coverImages) {
      const tasks = coverImages.map((file) => {
        const item = findMediaItemForCover(file);
        if (!item) return Promise.resolve({ matched: false, name: file.name });
        return coverFileToBlob(file).then((blob) => {
          if (!blob) return { matched: false, name: file.name };
          attachThumbnailToItem(item, blob);
          return dbUpdateThumbnail(item.id, blob).then(() => ({ matched: true, name: file.name }));
        });
      });

      return Promise.all(tasks).then((results) => {
        const unmatched = results.filter((r) => r && !r.matched);
        if (unmatched.length > 0) {
          alert(`以下封面图片未找到同名音视频：\n${unmatched.map((r) => r.name).join('\n')}`);
        }
        if (activeId !== null) {
          const activeItem = mediaItems.find((m) => m.id === activeId);
          if (activeItem) updatePlayerInfo(activeItem);
        }
        renderList();
      });
    }

    function processLrcFiles(lrcFiles) {
      const tasks = lrcFiles.map((file) => file.text().then((text) => {
        const baseName = getBaseName(file.name);
        const folder = getFolderFromFile(file);
        const item = mediaItems.find((m) => getBaseName(m.name) === baseName && m.folder === folder)
          || mediaItems.find((m) => getBaseName(m.name) === baseName);
        if (!item) return { matched: false, name: file.name };
        const lines = parseLRC(text);
        item.subtitleLrc = text;
        item.subtitleLines = lines;
        return dbUpdateSubtitle(item.id, text).then(() => ({ matched: true, name: file.name }));
      }));

      return Promise.all(tasks).then((results) => {
        const unmatched = results.filter((r) => r && !r.matched);
        if (unmatched.length > 0) {
          alert(`以下字幕文件未找到同名音视频：\n${unmatched.map((r) => r.name).join('\n')}`);
        }
        if (activeId !== null) {
          const activeItem = mediaItems.find((m) => m.id === activeId);
          loadSubtitlesForItem(activeItem);
        }
        renderList();
      });
    }

        completedItems = {};
      }
    }

    function persistPositions() {
      localStorage.setItem(POSITIONS_KEY, JSON.stringify(playbackPositions));
    }

    function persistCompleted() {
      localStorage.setItem(COMPLETED_KEY, JSON.stringify(completedItems));
    }

    function isCompleted(id) {
      return completedItems[String(id)] === true;
    }

    function markAsCompleted(id) {
      completedItems[String(id)] = true;
      persistCompleted();
    }

    function unmarkCompleted(id) {
      delete completedItems[String(id)];
      persistCompleted();
    }

    function removeCompleted(id) {
      unmarkCompleted(id);
    }

    function clearAllCompleted() {
      completedItems = {};
      localStorage.removeItem(COMPLETED_KEY);
    }

    function getSavedPosition(id) {
      const pos = playbackPositions[String(id)];
      return Number.isFinite(pos) ? pos : 0;
    }

    function savePositionForFile(fileId, player) {
      if (fileId === null || !player) return;
      const time = player.currentTime;
      if (!Number.isFinite(time) || time < 1) return;
      const duration = player.duration;
      if (Number.isFinite(duration) && time >= duration - 3) {
        delete playbackPositions[String(fileId)];
      } else {
        playbackPositions[String(fileId)] = time;
      }
      persistPositions();
    }

      if (activeId === null) return;
      savePositionForFile(activeId, getActivePlayer());
      updateFileItemMeta(activeId);
