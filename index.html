<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>聆息音乐播放器</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      padding: 16px 20px;
      border-bottom: 1px solid #1e293b;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .btn-help {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: #1e293b;
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .btn-help:hover {
      background: #334155;
      color: #e2e8f0;
    }

    .help-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(4px);
    }

    .help-overlay.open { display: flex; }

    .help-dialog {
      width: min(720px, 100%);
      max-height: min(85vh, 900px);
      display: flex;
      flex-direction: column;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .help-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }

    .help-header h2 {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .help-close {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #94a3b8;
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
    }

    .help-close:hover {
      background: #334155;
      color: #e2e8f0;
    }

    .help-body {
      padding: 20px 24px 24px;
      overflow-y: auto;
      font-size: 0.9rem;
      line-height: 1.7;
      color: #cbd5e1;
      scrollbar-width: thin;
      scrollbar-color: #334155 transparent;
    }

    .help-body::-webkit-scrollbar { width: 6px; }
    .help-body::-webkit-scrollbar-track { background: transparent; }
    .help-body::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    .help-body h1,
    .help-body h2,
    .help-body h3 {
      color: #f1f5f9;
      margin: 1.4em 0 0.6em;
      line-height: 1.4;
    }

    .help-body h1 { font-size: 1.35rem; margin-top: 0; }
    .help-body h2 { font-size: 1.1rem; border-bottom: 1px solid #334155; padding-bottom: 0.35em; }
    .help-body h3 { font-size: 0.98rem; color: #e2e8f0; }

    .help-body p { margin: 0.6em 0; }
    .help-body ul { margin: 0.6em 0; padding-left: 1.4em; }
    .help-body li { margin: 0.35em 0; }
    .help-body strong { color: #f8fafc; font-weight: 600; }

    .help-body blockquote {
      margin: 0.8em 0;
      padding: 10px 14px;
      border-left: 3px solid #2563eb;
      background: rgba(37, 99, 235, 0.1);
      border-radius: 0 8px 8px 0;
      color: #94a3b8;
    }

    .help-body pre {
      margin: 0.8em 0;
      padding: 12px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.82rem;
      line-height: 1.5;
      color: #94a3b8;
    }

    .help-body code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.88em;
      background: #0f172a;
      padding: 0.1em 0.35em;
      border-radius: 4px;
      color: #7dd3fc;
    }

    .help-body pre code {
      background: none;
      padding: 0;
      color: inherit;
    }

    .help-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.8em 0;
      font-size: 0.88rem;
    }

    .help-body th,
    .help-body td {
      border: 1px solid #334155;
      padding: 8px 12px;
      text-align: left;
    }

    .help-body th {
      background: #0f172a;
      color: #e2e8f0;
      font-weight: 600;
    }

    .header-logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .header h1 { font-size: 1.25rem; }

    .layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .sidebar {
      width: 280px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: #0b1220;
      min-width: 180px;
      max-width: 600px;
      transition: background 0.2s, outline-color 0.2s;
    }

    .sidebar.dragover {
      background: rgba(56, 189, 248, 0.06);
      outline: 2px dashed #38bdf8;
      outline-offset: -2px;
    }

    .sidebar-resizer {
      width: 5px;
      flex-shrink: 0;
      cursor: col-resize;
      background: #1e293b;
      position: relative;
      transition: background 0.15s;
    }

    .sidebar-resizer::before {
      content: '';
      position: absolute;
      left: -4px;
      right: -4px;
      top: 0;
      bottom: 0;
    }

    .sidebar-resizer:hover,
    .sidebar-resizer.dragging {
      background: #38bdf8;
    }

    body.resizing {
      cursor: col-resize;
      user-select: none;
    }

    body.resizing iframe,
    body.resizing video {
      pointer-events: none;
    }

    .sidebar-header {
      padding: 14px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sidebar-header h2 {
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex: 1;
      min-width: 0;
    }

    .sidebar-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-add,
    .btn-clear,
    .btn-sort {
      padding: 4px 10px;
      font-size: 0.8rem;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #e2e8f0;
      cursor: pointer;
    }

    .btn-add:hover,
    .btn-sort:hover { background: rgba(51, 65, 85, 0.5); }

    .btn-sort.active {
      background: rgba(37, 99, 235, 0.2);
      color: #93c5fd;
    }

    .btn-clear {
      color: #fca5a5;
    }

    .btn-clear:hover { background: rgba(69, 10, 10, 0.5); }

    .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
    }

    .btn-icon-img {
      width: 16px;
      height: 16px;
      object-fit: contain;
      pointer-events: none;
      display: block;
    }

    .sidebar-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 16px 8px;
      background: #0b1220;
    }

    .toolbar-label {
      font-size: 0.75rem;
      color: #64748b;
    }

    .file-list {
      flex: 1;
      overflow-y: auto;
      padding: 0px 8px 12px;
      list-style: none;
      min-height: 0;
      background: #0b1220;
      scrollbar-width: thin;
      scrollbar-color: #334155 transparent;
    }

    .file-list::-webkit-scrollbar {
      width: 6px;
    }

    .file-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .file-list::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }

    .file-list::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    .file-list:empty::after {
      content: '拖拽文件夹或音视频到此处\A 或点击添加 / 添加文件夹';
      white-space: pre;
      display: block;
      text-align: center;
      color: #475569;
      font-size: 0.85rem;
      padding: 32px 12px;
      line-height: 1.6;
      cursor: pointer;
    }

    .folder-group {
      margin-bottom: 4px;
    }

    .folder-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
      position: sticky;
      top: 0;
      z-index: 2;
      background: #0b1220;
      box-shadow: 0 1px 0 #1e293b;
    }

    .folder-header:hover { background: #1e293b; }

    .folder-chevron {
      flex-shrink: 0;
      width: 12px;
      font-size: 0.7rem;
      color: #64748b;
      transition: transform 0.15s;
    }

    .folder-group.collapsed .folder-chevron {
      transform: rotate(-90deg);
    }

    .folder-name {
      flex: 1;
      min-width: 0;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .folder-count {
      flex-shrink: 0;
      font-size: 0.72rem;
      color: #64748b;
    }

    .btn-folder-clear {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
    }

    .folder-header:hover .btn-folder-clear { opacity: 1; }

    .btn-folder-clear img {
      width: 14px;
      height: 14px;
      pointer-events: none;
    }

    .btn-folder-clear:hover { background: rgba(69, 10, 10, 0.5); }

    .folder-items {
      list-style: none;
    }

    .folder-group.collapsed .folder-items {
      display: none;
    }

    .folder-items .file-item {
      padding-left: 18px;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 2px;
    }

    .file-item:hover { background: #1e293b; }

    .file-item.active {
      background: #1d4ed8;
    }

    .file-item.active .file-meta { color: #bfdbfe; }

    .file-icon {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      background: #334155;
      color: #94a3b8;
    }

    .file-item.active .file-icon {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .file-icon.video { background: #312e81; color: #a5b4fc; }
    .file-icon.audio { background: #14532d; color: #86efac; }
    .file-item.active .file-icon.video,
    .file-item.active .file-icon.audio {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .file-details {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-size: 0.88rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 2px;
    }

    .btn-remove {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
    }

    .file-item:hover .btn-remove { opacity: 1; }
    .btn-remove:hover { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-width: 0;
      overflow-y: auto;
    }

    .empty-state {
      text-align: center;
      color: #64748b;
    }

    .empty-state p { margin-top: 8px; font-size: 0.9rem; }

    .player-wrap {
      width: min(720px, 100%);
      display: none;
    }

    .player-wrap.active { display: block; }

    .player-card {
      background: linear-gradient(180deg, #1e293b 0%, #172033 100%);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px 24px 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .player-now-playing {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid #334155;
    }

    .player-badge {
      flex-shrink: 0;
      min-width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .player-badge.video {
      background: #312e81;
      color: #a5b4fc;
    }

    .player-badge.audio {
      background: #14532d;
      color: #86efac;
    }

    .player-meta {
      flex: 1;
      min-width: 0;
    }

    .player-label {
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 4px;
    }

    .player-title {
      font-size: 1rem;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.4;
      word-break: break-all;
    }

    .player-size {
      margin-top: 6px;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .player-media {
      margin-bottom: 16px;
      border-radius: 12px;
      overflow: hidden;
      background: #0f172a;
      border: 1px solid #1e293b;
    }

    .player-media video {
      display: none;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 70vh;
      background: #000;
      vertical-align: top;
    }

    .player-media audio { display: none; }

    .player-media video.visible { display: block; }

    .player-audio-visual {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 180px;
      padding: 32px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }

    .player-audio-visual.visible { display: flex; }

    .audio-wave {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 56px;
    }

    .audio-wave span {
      width: 5px;
      height: 14px;
      border-radius: 3px;
      background: #38bdf8;
      transition: height 0.2s;
    }

    .player-audio-visual.playing .audio-wave span {
      animation: audioWave 0.9s ease-in-out infinite;
    }

    .audio-wave span:nth-child(1) { animation-delay: 0s; }
    .audio-wave span:nth-child(2) { animation-delay: 0.1s; }
    .audio-wave span:nth-child(3) { animation-delay: 0.2s; }
    .audio-wave span:nth-child(4) { animation-delay: 0.3s; }
    .audio-wave span:nth-child(5) { animation-delay: 0.4s; }

    @keyframes audioWave {
      0%, 100% { height: 14px; }
      50% { height: 48px; }
    }

    .audio-visual-label {
      font-size: 0.85rem;
      color: #64748b;
    }

    .subtitle-panel {
      display: none;
      border-top: 1px solid #1e293b;
      background: #0b1220;
    }

    .subtitle-panel.visible { display: block; }

    .subtitle-scroll {
      height: 160px;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      padding: 20px 24px;
      mask-image: linear-gradient(to bottom, transparent 0%, #000 18%, #000 82%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 18%, #000 82%, transparent 100%);
    }

    .subtitle-lines {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .subtitle-line {
      padding: 6px 8px;
      text-align: center;
      font-size: 0.88rem;
      line-height: 1.5;
      color: #64748b;
      border-radius: 6px;
      transition: color 0.25s, transform 0.25s, opacity 0.25s;
    }

    .subtitle-line.active {
      color: #38bdf8;
      font-size: 1rem;
      font-weight: 600;
      transform: scale(1.02);
    }

    .subtitle-line.passed {
      opacity: 0.45;
    }

    .player-audio-visual.has-subtitle {
      min-height: 100px;
      padding: 20px 32px 12px;
    }

    .player-audio-visual.has-subtitle .audio-wave {
      height: 36px;
    }

    .player-audio-visual.has-subtitle .audio-visual-label {
      display: none;
    }

    .player-custom-controls {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .time-text {
      flex-shrink: 0;
      min-width: 42px;
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
      color: #94a3b8;
    }

    .time-text.duration { text-align: right; }

    .progress-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 14px;
      --progress: 0%;
      background: transparent;
      outline: none;
      cursor: pointer;
    }

    .progress-slider::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(to right, #38bdf8 0%, #38bdf8 var(--progress), #475569 var(--progress), #475569 100%);
    }

    .progress-slider::-moz-range-track {
      height: 6px;
      border-radius: 3px;
      background: #475569;
    }

    .progress-slider::-moz-range-progress {
      height: 6px;
      border-radius: 3px;
      background: #38bdf8;
    }

    .progress-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      margin-top: -4px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    .progress-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border: none;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
    }

    .progress-slider:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .btn-ctrl {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #1e293b;
      color: #e2e8f0;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-ctrl:hover:not(:disabled) {
      background: #334155;
      border-color: #475569;
    }

    .btn-ctrl:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-seek {
      min-width: 39px;
      height: 28px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .btn-track {
      width: 31px;
      height: 31px;
      font-size: 0.75rem;
    }

    .btn-play {
      width: 36px;
      height: 36px;
      font-size: 0.85rem;
      border-color: #2563eb;
      background: #1d4ed8;
    }

    .btn-play:hover:not(:disabled) {
      background: #2563eb;
      border-color: #3b82f6;
    }

    .volume-group {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    .speed-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .speed-label {
      font-size: 0.7rem;
      color: #64748b;
      white-space: nowrap;
    }

    .speed-select {
      height: 25px;
      padding: 0 6px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 0.7rem;
      cursor: pointer;
      outline: none;
    }

    .speed-select:hover {
      border-color: #475569;
    }

    .speed-select:focus {
      border-color: #3b82f6;
    }

    .btn-mute {
      width: 28px;
      height: 28px;
      font-size: 0.7rem;
    }

    .volume-slider {
      width: 62px;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: #334155;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #94a3b8;
      cursor: pointer;
    }

    .volume-slider::-moz-range-thumb {
      width: 12px;

  <script>
    const layout = document.querySelector('.layout');
    const sidebar = document.getElementById('sidebar');
    const sidebarResizer = document.getElementById('sidebarResizer');

    const videoPlayer = document.getElementById('videoPlayer');
    const audioPlayer = document.getElementById('audioPlayer');
    const audioVisual = document.getElementById('audioVisual');
    const audioVisualLabel = document.getElementById('audioVisualLabel');
    const subtitlePanel = document.getElementById('subtitlePanel');
    const subtitleScroll = document.getElementById('subtitleScroll');
    const subtitleLines = document.getElementById('subtitleLines');
    const playerBadge = document.getElementById('playerBadge');
    const playerTitle = document.getElementById('playerTitle');
    const playerSize = document.getElementById('playerSize');
    const timeCurrent = document.getElementById('timeCurrent');
    const timeDuration = document.getElementById('timeDuration');
    const progressBar = document.getElementById('progressBar');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnSeekBack = document.getElementById('btnSeekBack');
    const btnSeekForward = document.getElementById('btnSeekForward');
    const btnMute = document.getElementById('btnMute');
    const volumeBar = document.getElementById('volumeBar');
    const speedSelect = document.getElementById('speedSelect');
    const autoPlayNext = document.getElementById('autoPlayNext');

    const mediaItems = [];
    let activeId = null;
    let activeMediaEl = null;
    let isSeeking = false;
    let playbackPositions = {};
    let completedItems = {};
    let positionSaveTimer = null;
    let activeSubtitleIndex = -1;

    const ICON_PATHS = {
      logo: 'img/logo.svg',
      add: 'img/upload.svg',
      folder: 'img/文件夹.svg',
      clear: 'img/清空.svg',
      sortDefault: 'img/sort.svg',
      sortUp: 'img/操作-排序-升序.svg',
      sortDown: 'img/操作-排序-降序.svg',
    };

    const SIDEBAR_MIN = 180;
    const SIDEBAR_MAX = 600;
    const SIDEBAR_WIDTH_KEY = 'audioplayer-sidebar-width';
    const ACTIVE_ID_KEY = 'audioplayer-active-id';
    const SORT_KEY = 'audioplayer-sort-order';
    const VOLUME_KEY = 'audioplayer-volume';
    const POSITIONS_KEY = 'audioplayer-positions';
    const COMPLETED_KEY = 'audioplayer-completed';
    const PLAYBACK_RATE_KEY = 'audioplayer-playback-rate';
    const AUTO_PLAY_NEXT_KEY = 'audioplayer-auto-play-next';
    const COLLAPSED_FOLDERS_KEY = 'audioplayer-collapsed-folders';
    const UNGROUPED_FOLDER = '未分组';
    const PLAYBACK_RATES = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
    const DB_NAME = 'AudioPlayerDB';
    const DB_VERSION = 2;
    const STORE_NAME = 'mediaFiles';
    let sortOrder = localStorage.getItem(SORT_KEY) || 'added';
    let collapsedFolders = new Set();
    let isResizing = false;
    let dbPromise = null;

    try {
      const savedCollapsed = JSON.parse(localStorage.getItem(COLLAPSED_FOLDERS_KEY) || '[]');
      if (Array.isArray(savedCollapsed)) collapsedFolders = new Set(savedCollapsed);
    } catch {
      collapsedFolders = new Set();
    }

    function persistCollapsedFolders() {
      localStorage.setItem(COLLAPSED_FOLDERS_KEY, JSON.stringify([...collapsedFolders]));
    }

    function getFolderFromFile(file) {
      const path = file.webkitRelativePath || '';
      if (!path || !path.includes('/')) return UNGROUPED_FOLDER;
      const parts = path.split('/');
      parts.pop();
      return parts.join('/') || UNGROUPED_FOLDER;
    }

    function readDirectoryEntry(entry, basePath = '') {
      return new Promise((resolve) => {
        if (entry.isFile) {
          entry.file((file) => {
            const relativePath = basePath ? `${basePath}/${file.name}` : file.name;
            try {
              Object.defineProperty(file, 'webkitRelativePath', {
                value: relativePath,
                configurable: true,
              });
            } catch (_) {}
            resolve([file]);
          }, () => resolve([]));
          return;
        }

        if (!entry.isDirectory) {
          resolve([]);
          return;
        }

        const dirPath = basePath ? `${basePath}/${entry.name}` : entry.name;
        const reader = entry.createReader();
        const entries = [];

        const readBatch = () => {
          reader.readEntries(async (batch) => {
            if (!batch.length) {
              const nested = await Promise.all(entries.map((child) => readDirectoryEntry(child, dirPath)));
              resolve(nested.flat());
              return;
            }
            entries.push(...batch);
            readBatch();
          }, () => resolve([]));
        };

        readBatch();
      });
    }

    async function getFilesFromDrop(dataTransfer) {
      const items = [...dataTransfer.items].filter((item) => item.kind === 'file');
      if (!items.length) return [...dataTransfer.files];

      const hasEntry = items.some((item) => typeof item.webkitGetAsEntry === 'function');
      if (!hasEntry) return [...dataTransfer.files];

      const groups = await Promise.all(items.map((item) => {
        const entry = item.webkitGetAsEntry();
        return entry ? readDirectoryEntry(entry) : [];
      }));
      const files = groups.flat();
      return files.length ? files : [...dataTransfer.files];
    }

    function openDB() {
      if (!dbPromise) {
        dbPromise = new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onerror = () => reject(request.error);
          request.onsuccess = () => resolve(request.result);
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              const store = db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
              store.createIndex('addedAt', 'addedAt', { unique: false });
            }
          };
        });
      }
      return dbPromise;
    }

    function dbAddFile(file, duration = 0, folder = UNGROUPED_FOLDER) {
      return openDB().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const record = {
          name: file.name,
          type: isVideo(file) ? 'video' : 'audio',
          size: file.size,
          mimeType: file.type || '',
          blob: file,
          duration: duration || 0,
          folder: folder || UNGROUPED_FOLDER,
          addedAt: Date.now(),
        };
        const req = store.add(record);
        req.onsuccess = () => resolve({ ...record, id: req.result });
        req.onerror = () => reject(req.error);
      }));
    }

    function dbDeleteFile(id) {
      return openDB().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const req = tx.objectStore(STORE_NAME).delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      }));
    }

    function dbGetAllFiles() {
      return openDB().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).getAll();
        req.onsuccess = () => {
          resolve(req.result.sort((a, b) => a.addedAt - b.addedAt));
        };
        req.onerror = () => reject(req.error);
      }));
    }

    function dbClearAll() {
      return openDB().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const req = tx.objectStore(STORE_NAME).clear();
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      }));
    }

    function dbUpdateSubtitle(id, subtitleLrc) {
      return openDB().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const getReq = store.get(id);
        getReq.onsuccess = () => {
          const record = getReq.result;
          if (!record) {
            resolve(null);
            return;
          }
          record.subtitleLrc = subtitleLrc;
          const putReq = store.put(record);
          putReq.onsuccess = () => resolve(record);
          putReq.onerror = () => reject(putReq.error);
        };
        getReq.onerror = () => reject(getReq.error);
      }));
    }

    function dbUpdateDuration(id, duration) {
      return openDB().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const getReq = store.get(id);
        getReq.onsuccess = () => {
          const record = getReq.result;
          if (!record) {
            resolve(null);
            return;
          }
          record.duration = duration;
          const putReq = store.put(record);
          putReq.onsuccess = () => resolve(record);
          putReq.onerror = () => reject(putReq.error);
        };
        getReq.onerror = () => reject(getReq.error);
      }));
    }

    function recordToItem(record) {
      const file = new File([record.blob], record.name, {
        type: record.mimeType || (record.type === 'video' ? 'video/mp4' : 'audio/mpeg'),
      });
      return {
        id: record.id,
        file,
        objectUrl: URL.createObjectURL(record.blob),
        name: record.name,
        type: record.type,
        size: record.size,
        duration: record.duration || 0,
        folder: record.folder || UNGROUPED_FOLDER,
        subtitleLrc: record.subtitleLrc || '',
        subtitleLines: parseLRC(record.subtitleLrc || ''),
      };
    }

    function getBaseName(filename) {
      const dot = filename.lastIndexOf('.');
      return dot > 0 ? filename.slice(0, dot) : filename;
    }

    function isLrc(file) {
      return /\.lrc$/i.test(file.name);
    }

    function parseLRC(text) {
      if (!text) return [];
      const lines = [];
      const tagRegex = /\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]/g;

      text.split(/\r?\n/).forEach((rawLine) => {
        const line = rawLine.trim();
        if (!line) return;

        const times = [];
        let match;
        tagRegex.lastIndex = 0;
        while ((match = tagRegex.exec(line)) !== null) {
          const min = parseInt(match[1], 10);
          const sec = parseInt(match[2], 10);
          let frac = match[3] ? parseInt(match[3], 10) : 0;
          if (match[3]) {
            if (match[3].length === 1) frac *= 100;
            else if (match[3].length === 2) frac *= 10;
          }
          times.push(min * 60 + sec + frac / 1000);
        }

        const content = line.replace(/\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]/g, '').trim();
        if (!content) return;
        times.forEach((time) => lines.push({ time, text: content }));
      });

      return lines.sort((a, b) => a.time - b.time);
    }

    function renderSubtitleLines(lines) {
      subtitleLines.innerHTML = '';
      lines.forEach((line, index) => {
        const el = document.createElement('div');
        el.className = 'subtitle-line';
        el.textContent = line.text;
        el.dataset.index = index;
        subtitleLines.appendChild(el);
      });
    }

    function clearSubtitles() {
      activeSubtitleIndex = -1;
      subtitleLines.innerHTML = '';
      subtitlePanel.classList.remove('visible');
      audioVisual.classList.remove('has-subtitle');
      if (audioVisualLabel) audioVisualLabel.style.display = '';
    }

    function loadSubtitlesForItem(item) {
      const lines = item?.subtitleLines || [];
      activeSubtitleIndex = -1;
      renderSubtitleLines(lines);
      const hasSubtitle = lines.length > 0;
      subtitlePanel.classList.toggle('visible', hasSubtitle);
      audioVisual.classList.toggle('has-subtitle', hasSubtitle && item?.type === 'audio');
      if (audioVisualLabel) {
        audioVisualLabel.style.display = hasSubtitle && item?.type === 'audio' ? 'none' : '';
      }
      if (!hasSubtitle) subtitleScroll.scrollTop = 0;
    }

    function updateSubtitles(currentTime) {
      const item = mediaItems.find((m) => m.id === activeId);
      const lines = item?.subtitleLines || [];
      if (!lines.length) return;

      let index = -1;
      for (let i = lines.length - 1; i >= 0; i -= 1) {
        if (currentTime >= lines[i].time) {
          index = i;
          break;
        }
      }

      if (index === activeSubtitleIndex) return;
      activeSubtitleIndex = index;

      const children = subtitleLines.children;
      for (let i = 0; i < children.length; i += 1) {
        children[i].classList.toggle('active', i === index);
        children[i].classList.toggle('passed', index >= 0 && i < index);
      }

      if (index >= 0 && children[index]) {
        children[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function processLrcFiles(lrcFiles) {
      const tasks = lrcFiles.map((file) => file.text().then((text) => {
        const baseName = getBaseName(file.name);
        const folder = getFolderFromFile(file);
        const item = mediaItems.find((m) => getBaseName(m.name) === baseName && m.folder === folder)
          || mediaItems.find((m) => getBaseName(m.name) === baseName);
        if (!item) return { matched: false, name: file.name };
        const lines = parseLRC(text);
        item.subtitleLrc = text;
        item.subtitleLines = lines;
        return dbUpdateSubtitle(item.id, text).then(() => ({ matched: true, name: file.name }));
      }));

      return Promise.all(tasks).then((results) => {
        const unmatched = results.filter((r) => r && !r.matched);
        if (unmatched.length > 0) {
          alert(`以下字幕文件未找到同名音视频：\n${unmatched.map((r) => r.name).join('\n')}`);
        }
        if (activeId !== null) {
          const activeItem = mediaItems.find((m) => m.id === activeId);
          loadSubtitlesForItem(activeItem);
        }
        renderList();
      });
    }

    function saveActiveId() {
      if (activeId !== null) {
        localStorage.setItem(ACTIVE_ID_KEY, String(activeId));
      } else {
        localStorage.removeItem(ACTIVE_ID_KEY);
      }
    }

    function loadPositions() {
      try {
        playbackPositions = JSON.parse(localStorage.getItem(POSITIONS_KEY) || '{}');
      } catch {
        playbackPositions = {};
      }
    }

    function loadCompleted() {
      try {
        completedItems = JSON.parse(localStorage.getItem(COMPLETED_KEY) || '{}');
      } catch {
        completedItems = {};
      }
    }

    function persistPositions() {
      localStorage.setItem(POSITIONS_KEY, JSON.stringify(playbackPositions));
    }

    function persistCompleted() {
      localStorage.setItem(COMPLETED_KEY, JSON.stringify(completedItems));
    }

    function isCompleted(id) {
      return completedItems[String(id)] === true;
    }

    function markAsCompleted(id) {
      completedItems[String(id)] = true;
      persistCompleted();
    }

    function unmarkCompleted(id) {
      delete completedItems[String(id)];
      persistCompleted();
    }

    function removeCompleted(id) {
      unmarkCompleted(id);
    }

    function clearAllCompleted() {
      completedItems = {};
      localStorage.removeItem(COMPLETED_KEY);
    }

    function getSavedPosition(id) {
      const pos = playbackPositions[String(id)];
      return Number.isFinite(pos) ? pos : 0;
    }

    function savePositionForFile(fileId, player) {
      if (fileId === null || !player) return;
      const time = player.currentTime;
      if (!Number.isFinite(time) || time < 1) return;
      const duration = player.duration;
      if (Number.isFinite(duration) && time >= duration - 3) {
        delete playbackPositions[String(fileId)];
      } else {
        playbackPositions[String(fileId)] = time;
      }
      persistPositions();
    }

    function saveCurrentPosition() {
      if (activeId === null) return;
      savePositionForFile(activeId, getActivePlayer());
      updateFileItemMeta(activeId);
    }

    function saveCurrentPositionThrottled() {
      if (positionSaveTimer) return;
      positionSaveTimer = setTimeout(() => {
        positionSaveTimer = null;
        saveCurrentPosition();
      }, 2000);
    }

    function removeSavedPosition(id) {
      delete playbackPositions[String(id)];
      persistPositions();
    }

    function clearAllPositions() {
      playbackPositions = {};
      localStorage.removeItem(POSITIONS_KEY);
    }

    function clampSidebarWidth(width) {
      return Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, width));
    }

    function setSidebarWidth(width) {
      sidebar.style.width = `${clampSidebarWidth(width)}px`;
    }

    function initSidebarResize() {
      const saved = localStorage.getItem(SIDEBAR_WIDTH_KEY);
      if (saved) setSidebarWidth(Number(saved));

      sidebarResizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        sidebarResizer.classList.add('dragging');
        document.body.classList.add('resizing');
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        const layoutLeft = layout.getBoundingClientRect().left;
        setSidebarWidth(e.clientX - layoutLeft);
      });

      document.addEventListener('mouseup', () => {
        if (!isResizing) return;
        isResizing = false;
        sidebarResizer.classList.remove('dragging');
        document.body.classList.remove('resizing');
        localStorage.setItem(SIDEBAR_WIDTH_KEY, parseInt(sidebar.style.width, 10));
      });
    }

    function isVideo(file) {
      if (file.type.startsWith('video/')) return true;
      return /\.mp4$/i.test(file.name);
    }

    function isAudio(file) {
      if (file.type.startsWith('audio/')) return true;
      return /\.mp3$/i.test(file.name);
    }

    function isSupported(file) {
      return isVideo(file) || isAudio(file);
    }

    function showIdleView() {
      playerWrap.classList.remove('active');
      emptyState.style.display = 'block';
    }

    function showPlayerView() {
      playerWrap.classList.add('active');
      emptyState.style.display = 'none';
    }

    function updatePlayerInfo(item) {
      playerBadge.textContent = item.type === 'video' ? 'MP4' : 'MP3';
      playerBadge.className = `player-badge ${item.type}`;
      playerTitle.textContent = item.name;
      playerSize.textContent = formatSize(item.size);
    }

    function clearPlayerInfo() {
      playerTitle.textContent = '';
      playerSize.textContent = '';
      resetPlayerControls();
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      const pad = (n) => String(n).padStart(2, '0');
      if (h > 0) return `${h}:${pad(m)}:${pad(s)}`;
      return `${m}:${pad(s)}`;
    }

    function setControlsEnabled(enabled) {
      progressBar.disabled = !enabled;
      btnPlayPause.disabled = !enabled;
      btnSeekBack.disabled = !enabled;
      btnSeekForward.disabled = !enabled;
      if (!enabled) {
        btnPrev.disabled = true;
        btnNext.disabled = true;
      } else {
        updateTrackButtons();
      }
    }

    function updateTrackButtons() {
      const list = getDisplayItems();
      const index = list.findIndex((item) => item.id === activeId);
      const hasActive = activeId !== null && list.length > 0;
      btnPrev.disabled = !hasActive || index <= 0;
      btnNext.disabled = !hasActive || index >= list.length - 1;
    }

    function playPrev() {
      const list = getDisplayItems();
      const index = list.findIndex((item) => item.id === activeId);
      if (index > 0) playItem(list[index - 1].id);
    }

    function playNext() {
      const list = getDisplayItems();
      const index = list.findIndex((item) => item.id === activeId);
      if (index < list.length - 1) playItem(list[index + 1].id);
    }

    function resetPlayerControls() {
      isSeeking = false;
      progressBar.value = 0;
      setProgressFill(0);
      timeCurrent.textContent = '0:00';
      timeDuration.textContent = '0:00';
      btnPlayPause.textContent = '▶';
      btnPlayPause.title = '播放（Space）';
      audioVisual.classList.remove('playing');
      setControlsEnabled(false);
    }

    function getActivePlayer() {
      return activeMediaEl;
    }

    function setProgressFill(percent) {
      const value = Math.max(0, Math.min(100, percent));
      progressBar.style.setProperty('--progress', `${value}%`);
    }

    function updateProgressUI() {
      const player = getActivePlayer();
      if (!player) return;

      let currentTime = player.currentTime;
      if (!isSeeking) {
        timeCurrent.textContent = formatTime(player.currentTime);
        if (Number.isFinite(player.duration) && player.duration > 0) {
          const percent = (player.currentTime / player.duration) * 100;
          progressBar.value = percent;
          setProgressFill(percent);
          timeDuration.textContent = formatTime(player.duration);
        }
      } else if (Number.isFinite(player.duration) && player.duration > 0) {
        currentTime = (Number(progressBar.value) / 100) * player.duration;
      }

      updateSubtitles(currentTime);

      if (!player.paused && activeId !== null && !isSeeking) {
        saveCurrentPositionThrottled();
      }
    }

    function updatePlayPauseButton() {
      const player = getActivePlayer();
      if (!player) return;
      const paused = player.paused;
      btnPlayPause.textContent = paused ? '▶' : '⏸';
      btnPlayPause.title = paused ? '播放（Space）' : '暂停（Space）';
      audioVisual.classList.toggle('playing', !paused && activeMediaEl === audioPlayer);
    }

    function updateMuteButton() {
      const player = getActivePlayer();
      const muted = player ? player.muted || player.volume === 0 : volumeBar.value === '0';
      btnMute.textContent = muted ? '🔇' : '🔊';
      btnMute.title = muted ? '取消静音' : '静音';
    }

    function applyVolume(value) {
      const vol = Math.max(0, Math.min(1, value));
      videoPlayer.volume = vol;
      audioPlayer.volume = vol;
      videoPlayer.muted = vol === 0;
      audioPlayer.muted = vol === 0;
      volumeBar.value = vol;
      localStorage.setItem(VOLUME_KEY, String(vol));
      updateMuteButton();
    }

    function applyPlaybackRate(rate) {
      const r = Number(rate);
      if (!PLAYBACK_RATES.includes(r)) return;
      videoPlayer.playbackRate = r;
      audioPlayer.playbackRate = r;
      speedSelect.value = String(r);
      localStorage.setItem(PLAYBACK_RATE_KEY, String(r));
    }

    function getSavedPlaybackRate() {
      const saved = Number(localStorage.getItem(PLAYBACK_RATE_KEY));
      return PLAYBACK_RATES.includes(saved) ? saved : 1;
    }

    function togglePlayPause() {
      const player = getActivePlayer();
      if (!player) return;
      if (player.paused) {
        player.play().catch(() => {});
      } else {
        player.pause();
      }
    }

    function toggleMute() {
      const player = getActivePlayer();
      if (!player) return;
      if (player.muted || player.volume === 0) {
        const saved = Number(localStorage.getItem(VOLUME_KEY));
        applyVolume(saved > 0 ? saved : 1);
      } else {
        applyVolume(0);
      }
    }

    function seekBy(seconds) {
      const player = getActivePlayer();
      if (!player) return;
      const duration = player.duration;
      let target = player.currentTime + seconds;
      if (Number.isFinite(duration)) {
        target = Math.max(0, Math.min(duration, target));
      } else {
        target = Math.max(0, target);
      }
      player.currentTime = target;
      updateProgressUI();
      saveCurrentPosition();
    }

    function seekToPercent(percent) {
      const player = getActivePlayer();
      if (!player || !Number.isFinite(player.duration)) return;
      player.currentTime = (percent / 100) * player.duration;
      updateProgressUI();
    }

    function stopPlayback(savePosition = false) {
      if (savePosition && activeMediaEl && activeId !== null) {
        savePositionForFile(activeId, activeMediaEl);
      }
      videoPlayer.pause();
      audioPlayer.pause();
      videoPlayer.removeAttribute('src');
      audioPlayer.removeAttribute('src');
      videoPlayer.classList.remove('visible');
      audioVisual.classList.remove('visible');
      audioVisual.classList.remove('playing');
      activeMediaEl = null;
      resetPlayerControls();
      clearSubtitles();
    }

    function onMediaLoaded() {
      const player = getActivePlayer();
      if (!player) return;
      timeDuration.textContent = formatTime(player.duration);
      const savedPos = getSavedPosition(activeId);
      if (savedPos > 0 && Number.isFinite(player.duration) && savedPos < player.duration - 3) {
        player.currentTime = savedPos;
      }
      player.playbackRate = getSavedPlaybackRate();
      speedSelect.value = String(player.playbackRate);
      setControlsEnabled(true);
      updateProgressUI();
      updatePlayPauseButton();
    }

    function initCustomPlayer() {
      const savedVolume = Number(localStorage.getItem(VOLUME_KEY));
      applyVolume(Number.isFinite(savedVolume) ? savedVolume : 1);
      applyPlaybackRate(getSavedPlaybackRate());

      [videoPlayer, audioPlayer].forEach((el) => {
        el.addEventListener('timeupdate', updateProgressUI);
        el.addEventListener('loadedmetadata', onMediaLoaded);
        el.addEventListener('play', updatePlayPauseButton);
        el.addEventListener('pause', () => {
          updatePlayPauseButton();
          saveCurrentPosition();
        });
        el.addEventListener('ended', () => {
          updatePlayPauseButton();
          if (activeId !== null) {
            const finishedId = activeId;
            delete playbackPositions[String(finishedId)];
            persistPositions();
            markAsCompleted(finishedId);
            updateFileItemMeta(finishedId);
          }
          if (autoPlayNext.checked) {
            playNext();
          }
        });
      });

      btnPlayPause.addEventListener('click', togglePlayPause);
      btnPrev.addEventListener('click', playPrev);
      btnNext.addEventListener('click', playNext);
      btnSeekBack.addEventListener('click', () => seekBy(-10));
      btnSeekForward.addEventListener('click', () => seekBy(10));
      btnMute.addEventListener('click', toggleMute);

      progressBar.addEventListener('mousedown', () => { isSeeking = true; });
      progressBar.addEventListener('touchstart', () => { isSeeking = true; }, { passive: true });
      progressBar.addEventListener('input', () => {
        const percent = Number(progressBar.value);
        setProgressFill(percent);
        seekToPercent(percent);
      });
      progressBar.addEventListener('change', () => {
        isSeeking = false;
        saveCurrentPosition();
      });
      document.addEventListener('mouseup', () => { isSeeking = false; });

      volumeBar.addEventListener('input', () => applyVolume(Number(volumeBar.value)));
      speedSelect.addEventListener('change', () => applyPlaybackRate(Number(speedSelect.value)));

      autoPlayNext.checked = localStorage.getItem(AUTO_PLAY_NEXT_KEY) === 'true';
      autoPlayNext.addEventListener('change', () => {
        localStorage.setItem(AUTO_PLAY_NEXT_KEY, String(autoPlayNext.checked));
      });
    }

    function isShortcutBlocked(target) {
      const tag = target.tagName;
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || target.isContentEditable;
    }

    function initKeyboardShortcuts() {
      document.addEventListener('keydown', (e) => {
        if (isShortcutBlocked(e.target)) return;

        switch (e.code) {
          case 'Space':
            e.preventDefault();
            togglePlayPause();
            break;
          case 'ArrowLeft':
            e.preventDefault();
            seekBy(-10);
            break;
          case 'ArrowRight':
            e.preventDefault();
            seekBy(10);
            break;
          case 'PageUp':
            e.preventDefault();
            playPrev();
            break;
          case 'PageDown':
            e.preventDefault();
            playNext();
            break;
        }
      });
    }

    function formatSize(bytes) {
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
    }

    function formatFileMeta(item) {
      const parts = [formatSize(item.size)];
      if (item.duration > 0) parts.push(formatTime(item.duration));
      if (isCompleted(item.id)) {
        parts.push('已播完');
      } else {
        const savedPos = getSavedPosition(item.id);
        if (savedPos > 0) parts.push(`上次 ${formatTime(savedPos)}`);
      }
      if (item.subtitleLines?.length) parts.push('字幕');
      return parts.join(' · ');
    }

    function updateFileItemMeta(id) {
      const item = mediaItems.find((m) => m.id === id);
      if (!item) return;
      const li = fileList.querySelector(`[data-id="${id}"]`);
      if (!li) return;
      const meta = li.querySelector('.file-meta');
      if (meta) meta.textContent = formatFileMeta(item);
    }

    function probeMediaDuration(file, type) {
      return new Promise((resolve) => {
        const el = type === 'video' ? document.createElement('video') : document.createElement('audio');
        const url = URL.createObjectURL(file);
        el.preload = 'metadata';

        const cleanup = () => {
          el.removeAttribute('src');
          el.load();
          URL.revokeObjectURL(url);
        };

        el.addEventListener('loadedmetadata', () => {
          const duration = Number.isFinite(el.duration) ? el.duration : 0;
          cleanup();
          resolve(duration);
        });
        el.addEventListener('error', () => {
          cleanup();
          resolve(0);
        });
        el.src = url;
      });
    }

    function addMediaFile(file) {
      const type = isVideo(file) ? 'video' : 'audio';
      const folder = getFolderFromFile(file);
      return probeMediaDuration(file, type)
        .then((duration) => dbAddFile(file, duration, folder))
        .then((record) => recordToItem(record));
    }

    function probeMissingDurations() {
      const pending = mediaItems.filter((item) => !item.duration);
      if (!pending.length) return Promise.resolve();

      return Promise.all(pending.map((item) => probeMediaDuration(item.file, item.type).then((duration) => {
        item.duration = duration;
        if (duration > 0) return dbUpdateDuration(item.id, duration);
      }))).then(() => {
        renderList();
      });
    }

    function compareFileName(a, b) {
      return a.name.localeCompare(b.name, 'zh-CN', { sensitivity: 'base', numeric: true });
    }

    function getGroupedItems() {
      const groups = new Map();
      getDisplayItems().forEach((item) => {
        const folder = item.folder || UNGROUPED_FOLDER;
        if (!groups.has(folder)) groups.set(folder, []);
        groups.get(folder).push(item);
      });

      const folderNames = [...groups.keys()].sort((a, b) => {
        if (a === UNGROUPED_FOLDER) return 1;
        if (b === UNGROUPED_FOLDER) return -1;
        return a.localeCompare(b, 'zh-CN', { sensitivity: 'base', numeric: true });
      });

      return folderNames.map((folder) => ({ folder, items: groups.get(folder) }));
    }

    function shouldShowFolderGroups(groups) {
      if (groups.length > 1) return true;
      return groups.length === 1 && groups[0].folder !== UNGROUPED_FOLDER;
    }

    function createFileListItem(item) {
      const li = document.createElement('li');
      li.className = 'file-item' + (item.id === activeId ? ' active' : '');
      li.dataset.id = item.id;

      const icon = document.createElement('span');
      icon.className = `file-icon ${item.type}`;
      icon.textContent = item.type === 'video' ? 'MP4' : 'MP3';

      const details = document.createElement('div');
      details.className = 'file-details';

      const name = document.createElement('div');
      name.className = 'file-name';
      name.textContent = item.name;
      name.title = item.name;

      const meta = document.createElement('div');
      meta.className = 'file-meta';
      meta.textContent = formatFileMeta(item);

      details.appendChild(name);
      details.appendChild(meta);

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'btn-remove';
      removeBtn.title = '移除';
      removeBtn.textContent = '×';
      removeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        removeItem(item.id);
      });

      li.appendChild(icon);
      li.appendChild(details);
      li.appendChild(removeBtn);
      li.addEventListener('click', () => playItem(item.id));
      return li;
    }

    function toggleFolderGroup(folder) {
      if (collapsedFolders.has(folder)) collapsedFolders.delete(folder);
      else collapsedFolders.add(folder);
      persistCollapsedFolders();
      renderList();
    }

    function getDisplayItems() {
      const items = [...mediaItems];
      if (sortOrder === 'name-asc') return items.sort((a, b) => compareFileName(a, b));
      if (sortOrder === 'name-desc') return items.sort((a, b) => compareFileName(b, a));
      return items;
    }

    function updateSortButton() {
      const titles = {
        added: '按添加顺序',
        'name-asc': '文件名 A → Z',
        'name-desc': '文件名 Z → A',
      };
      const icons = {
        added: ICON_PATHS.sortDefault,
        'name-asc': ICON_PATHS.sortUp,
        'name-desc': ICON_PATHS.sortDown,
      };
      btnSortIcon.src = icons[sortOrder];
      btnSort.title = titles[sortOrder];
      btnSort.classList.toggle('active', sortOrder !== 'added');
    }

    function toggleSort() {
      if (sortOrder === 'added') sortOrder = 'name-asc';
      else if (sortOrder === 'name-asc') sortOrder = 'name-desc';
      else sortOrder = 'added';
      localStorage.setItem(SORT_KEY, sortOrder);
      updateSortButton();
      renderList();
      updateTrackButtons();
    }

    function addFiles(files) {
      const allFiles = Array.from(files);
      const lrcFiles = allFiles.filter(isLrc);
      const supported = allFiles.filter((file) => !isLrc(file) && isSupported(file));

      if (supported.length === 0 && lrcFiles.length === 0) {
        alert('仅支持 MP4、MP3 和 LRC 字幕文件');
        return;
      }

      const addMedia = supported.length
        ? Promise.all(supported.map((file) => addMediaFile(file))).then((items) => {
          items.forEach((item) => mediaItems.push(item));
        })
        : Promise.resolve();

      addMedia
        .then(() => (lrcFiles.length ? processLrcFiles(lrcFiles) : null))
        .then(() => {
          renderList();
        })
        .catch(() => {
          alert('保存文件失败，请重试');
        });
    }

    function removeItem(id) {
      const index = mediaItems.findIndex((item) => item.id === id);
      if (index === -1) return;

      dbDeleteFile(id)
        .then(() => {
          const [removed] = mediaItems.splice(index, 1);
          URL.revokeObjectURL(removed.objectUrl);
          removeSavedPosition(id);
          removeCompleted(id);

          if (activeId === id) {
            activeId = null;
            saveActiveId();
            stopPlayback();
            showIdleView();
            clearPlayerInfo();

            if (mediaItems.length > 0) {
              const next = mediaItems[Math.min(index, mediaItems.length - 1)];
              playItem(next.id);
            }
          }

          renderList();
        })
        .catch(() => {
          alert('删除文件失败，请重试');
        });
    }

    function loadPersistedFiles() {
      return dbGetAllFiles()
        .then((records) => {
          mediaItems.length = 0;
          records.forEach((record) => {
            mediaItems.push(recordToItem(record));
          });
          renderList();

          const savedActiveId = Number(localStorage.getItem(ACTIVE_ID_KEY));
          if (savedActiveId && mediaItems.some((item) => item.id === savedActiveId)) {
            activeId = savedActiveId;
            renderList();
          }

          return probeMissingDurations();
        })
        .catch(() => {
          alert('加载已保存文件失败');
        });
    }

    function clearFolderItems(folder) {
      const items = mediaItems.filter((item) => (item.folder || UNGROUPED_FOLDER) === folder);
      if (!items.length) return;

      const label = folder === UNGROUPED_FOLDER ? '未分组' : folder;
      if (!confirm(`确定清空「${label}」下的全部文件吗？此操作不可恢复。`)) return;

      Promise.all(items.map((item) => dbDeleteFile(item.id)))
        .then(() => {
          const ids = new Set(items.map((item) => item.id));
          items.forEach((item) => {
            URL.revokeObjectURL(item.objectUrl);
            removeSavedPosition(item.id);
            removeCompleted(item.id);
          });

          for (let i = mediaItems.length - 1; i >= 0; i -= 1) {
            if (ids.has(mediaItems[i].id)) mediaItems.splice(i, 1);
          }

          if (activeId !== null && ids.has(activeId)) {
            activeId = null;
            saveActiveId();
            stopPlayback();
            showIdleView();
            clearPlayerInfo();
          }

          renderList();
        })
        .catch(() => {
          alert('清空失败，请重试');
        });
    }

    function clearAllItems() {
      if (mediaItems.length === 0) return;
      if (!confirm('确定清空全部文件吗？此操作不可恢复。')) return;

      dbClearAll()
        .then(() => {
          mediaItems.forEach((item) => URL.revokeObjectURL(item.objectUrl));
          mediaItems.length = 0;
          activeId = null;
          saveActiveId();
          clearAllPositions();
          clearAllCompleted();
          stopPlayback();
          showIdleView();
          clearPlayerInfo();
          renderList();
        })
        .catch(() => {
          alert('清空失败，请重试');
        });
    }

    function renderList() {
      fileList.innerHTML = '';
      const groups = getGroupedItems();

      if (!shouldShowFolderGroups(groups)) {
        groups[0]?.items.forEach((item) => {
          fileList.appendChild(createFileListItem(item));
        });
        return;
      }

      groups.forEach(({ folder, items }) => {
        const group = document.createElement('li');
        group.className = 'folder-group' + (collapsedFolders.has(folder) ? ' collapsed' : '');

        const header = document.createElement('div');
        header.className = 'folder-header';
        header.title = folder;

        const chevron = document.createElement('span');
        chevron.className = 'folder-chevron';
        chevron.textContent = '▼';

        const folderName = document.createElement('span');
        folderName.className = 'folder-name';
        folderName.textContent = folder;

        const count = document.createElement('span');
        count.className = 'folder-count';
        count.textContent = String(items.length);

        const clearBtn = document.createElement('button');
        clearBtn.type = 'button';
        clearBtn.className = 'btn-folder-clear';
        clearBtn.title = '清空此文件夹';
        clearBtn.setAttribute('aria-label', '清空此文件夹');
        const clearIcon = document.createElement('img');
        clearIcon.src = ICON_PATHS.clear;
        clearIcon.alt = '';
        clearBtn.appendChild(clearIcon);
        clearBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          clearFolderItems(folder);
        });

        header.appendChild(chevron);
        header.appendChild(folderName);
        header.appendChild(count);
        header.appendChild(clearBtn);
        header.addEventListener('click', () => toggleFolderGroup(folder));

        const itemsEl = document.createElement('ul');
        itemsEl.className = 'folder-items';
        items.forEach((item) => itemsEl.appendChild(createFileListItem(item)));

        group.appendChild(header);
        group.appendChild(itemsEl);
        fileList.appendChild(group);
      });
    }

    function playItem(id) {
      const item = mediaItems.find((m) => m.id === id);
      if (!item) return;

      if (activeMediaEl && activeId !== null && activeId !== id) {
        savePositionForFile(activeId, activeMediaEl);
      }

      unmarkCompleted(id);
      activeId = id;
      saveActiveId();
      renderList();

      videoPlayer.pause();
      audioPlayer.pause();
      videoPlayer.removeAttribute('src');
      audioPlayer.removeAttribute('src');
      videoPlayer.classList.remove('visible');
      audioVisual.classList.remove('visible');
      audioVisual.classList.remove('playing');
      activeMediaEl = null;
      resetPlayerControls();

      if (item.type === 'video') {
        videoPlayer.src = item.objectUrl;
        videoPlayer.classList.add('visible');
        activeMediaEl = videoPlayer;
      } else {
        audioPlayer.src = item.objectUrl;
        audioVisual.classList.add('visible');
        activeMediaEl = audioPlayer;
      }

      activeMediaEl.load();
      activeMediaEl.play().catch(() => {});

      showPlayerView();
      updatePlayerInfo(item);
      loadSubtitlesForItem(item);
      setControlsEnabled(false);
      timeCurrent.textContent = '0:00';
      timeDuration.textContent = '0:00';
      btnPlayPause.textContent = '▶';
    }

    function setupDropZone(el) {
      let dragCounter = 0;

      el.addEventListener('dragenter', (e) => {
        e.preventDefault();
        dragCounter += 1;
        el.classList.add('dragover');
      }, true);

      el.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
      }, true);

      el.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dragCounter -= 1;
        if (dragCounter <= 0) {
          dragCounter = 0;
          el.classList.remove('dragover');
        }
      }, true);

      el.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        dragCounter = 0;
        el.classList.remove('dragover');
        getFilesFromDrop(e.dataTransfer).then((files) => {
          if (files.length) addFiles(files);
        });
      }, true);
    }

    function preventBrowserFileDrop() {
      window.addEventListener('dragover', (e) => {
        e.preventDefault();
      });
      window.addEventListener('drop', (e) => {
        if (!sidebar.contains(e.target)) {
          e.preventDefault();
        }
      });
    }

    function initHelpModal() {
      const btnHelp = document.getElementById('btnHelp');
      const btnHelpClose = document.getElementById('btnHelpClose');
      const helpOverlay = document.getElementById('helpOverlay');
      const helpBody = document.getElementById('helpBody');
      let helpLoaded = false;

      const readmeFallback = `# 聆息音乐播放器

聆息是一个纯前端的本地音乐播放器，单文件即可运行，无需安装、无需联网。支持 MP4 / MP3 播放、LRC 字幕同步、播放进度记忆与媒体库持久化。

## 功能介绍

### 媒体管理

- 支持添加 **MP4、MP3** 音视频文件
- 支持导入 **LRC 字幕**（按文件名自动匹配同名媒体）
- 拖拽文件到左侧目录，或点击「添加」按钮选择文件
- 列表显示文件大小、时长、上次播放位置、已播完状态、字幕标记
- 三种排序方式：默认（添加顺序）、名称升序、名称降序
- 侧边栏宽度可拖拽调整（180–600px），刷新后保持

### 播放控制

- 自定义播放界面：进度条、播放/暂停、±10 秒、上一曲/下一曲
- 音量调节与静音
- 播放倍速：0.5x ~ 2x
- 音频显示波形动画，视频按 16:9 比例展示
- LRC 字幕实时滚动同步
- 可选「播放结束后自动下一首」

### 数据持久化

- **IndexedDB** 保存媒体文件，刷新页面后文件仍在
- **localStorage** 记录：
  - 每个文件的播放进度
  - 已播完标记
  - 当前选中文件、排序方式、音量、倍速、侧边栏宽度等

## 使用方法

1. 用浏览器直接打开 \`index.html\`
2. 将 MP4 / MP3 / LRC 文件拖入左侧「媒体目录」，或点击添加按钮选择文件
3. 在列表中点击文件开始播放
4. 使用底部控制栏或快捷键操作播放

> 列表为空时，点击空白区域可快速打开文件选择器；已有文件时请点击「添加」按钮。

## 快捷键

| \`PageDown\` | 下一曲 |

鼠标悬停在操作按钮上可查看对应提示。

## 设计说明

      function escapeHtml(text) {
        return text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function inlineMarkdown(text) {
        return escapeHtml(text)
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/`([^`]+)`/g, '<code>$1</code>');
      }

      function renderMarkdown(md) {
        const lines = md.replace(/\r\n/g, '\n').split('\n');
        let html = '';
        let inCode = false;
        let codeLines = [];
        let inList = false;
        let tableLines = [];

        const closeList = () => {
          if (inList) {
            html += '</ul>';
            inList = false;
          }
        };

        const flushTable = () => {
          if (!tableLines.length) return;
          const rows = tableLines.filter((line) => !/^\|[-\s:|]+\|$/.test(line.trim()));
          tableLines = [];
          if (!rows.length) return;

          html += '<table>';
          rows.forEach((row, index) => {
            const cells = row.trim().replace(/^\||\|$/g, '').split('|').map((cell) => cell.trim());
            const tag = index === 0 ? 'th' : 'td';
            if (index === 0) html += '<thead><tr>';
            else if (index === 1) html += '<tbody><tr>';
            else html += '<tr>';
            html += cells.map((cell) => `<${tag}>${inlineMarkdown(cell)}</${tag}>`).join('');
            html += '</tr>';
            if (index === 0) html += '</thead>';
          });
          html += '</tbody></table>';
        };

        lines.forEach((line) => {
          if (line.startsWith('```')) {
            closeList();
            flushTable();
            if (!inCode) {
              inCode = true;
              codeLines = [];
            } else {
              html += `<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`;
              inCode = false;
            }
            return;
          }

          if (inCode) {
            codeLines.push(line);
            return;
          }

          if (line.trim().startsWith('|')) {
            closeList();
            tableLines.push(line);
            return;
          }

          flushTable();

          if (!line.trim()) {
            closeList();
            return;
          }

          if (line.startsWith('### ')) {
            closeList();
            html += `<h3>${inlineMarkdown(line.slice(4))}</h3>`;
            return;
          }

          if (line.startsWith('## ')) {
            closeList();
            html += `<h2>${inlineMarkdown(line.slice(3))}</h2>`;
            return;
          }

          if (line.startsWith('# ')) {
            closeList();
            html += `<h1>${inlineMarkdown(line.slice(2))}</h1>`;
            return;
          }

          if (line.startsWith('> ')) {
            closeList();
            html += `<blockquote><p>${inlineMarkdown(line.slice(2))}</p></blockquote>`;
            return;
          }

          if (line.startsWith('- ')) {
            if (!inList) {
              html += '<ul>';
              inList = true;
            }
            html += `<li>${inlineMarkdown(line.slice(2))}</li>`;
            return;
          }

          closeList();
          html += `<p>${inlineMarkdown(line)}</p>`;
        });

        closeList();
        flushTable();
        if (inCode) {
          html += `<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`;
        }
        return html;
      }

      async function loadHelpContent() {
        if (helpLoaded) return;
        try {
          const res = await fetch('README.md');
          if (!res.ok) throw new Error('fetch failed');
          helpBody.innerHTML = renderMarkdown(await res.text());
        } catch {
          helpBody.innerHTML = renderMarkdown(readmeFallback);
        }
        helpLoaded = true;
      }

      function openHelp() {
        loadHelpContent().then(() => {
          helpOverlay.classList.add('open');
          helpOverlay.setAttribute('aria-hidden', 'false');
        });
      }

      function closeHelp() {
        helpOverlay.classList.remove('open');
        helpOverlay.setAttribute('aria-hidden', 'true');
      }

      btnHelp.addEventListener('click', openHelp);
      btnHelpClose.addEventListener('click', closeHelp);
      helpOverlay.addEventListener('click', (e) => {
        if (e.target === helpOverlay) closeHelp();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && helpOverlay.classList.contains('open')) closeHelp();
      });
    }

    initSidebarResize();
    initHelpModal();
    loadPositions();
    loadCompleted();
    initCustomPlayer();
    initKeyboardShortcuts();
    preventBrowserFileDrop();
    loadPersistedFiles();

    setupDropZone(sidebar);

    fileList.addEventListener('click', (e) => {
      if (mediaItems.length === 0 && !e.target.closest('.file-item')) fileInput.click();
    });
    btnAdd.addEventListener('click', () => fileInput.click());
    btnAddFolder.addEventListener('click', () => folderInput.click());
    btnClear.addEventListener('click', clearAllItems);
    btnSort.addEventListener('click', toggleSort);
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) addFiles(e.target.files);
      e.target.value = '';
    });
    folderInput.addEventListener('change', (e) => {
      if (e.target.files.length) addFiles(e.target.files);
      e.target.value = '';
    });

    window.addEventListener('beforeunload', () => {
      saveCurrentPosition();
      mediaItems.forEach((item) => URL.revokeObjectURL(item.objectUrl));
    });
  </script>
